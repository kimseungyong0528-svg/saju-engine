[project]
name = "saju-engine"
version = "0.2.0"
description = "운명서재 사주 엔진: 만세력, 사주팔자, 오행, 십신, 대운, 평생사주 PDF"
requires-python = ">=3.11"
dependencies = [
    "ephem>=4.1",
    "korean-lunar-calendar>=0.3",
]

[project.optional-dependencies]
report = ["jinja2>=3.1", "weasyprint>=62", "anthropic>=0.40"]
video = ["numpy>=1.26", "playwright>=1.47", "supertonic>=1.3"]
dev = ["pytest>=8", "numpy>=1.26", "sxtwl>=2.0", "jinja2>=3.1", "weasyprint>=62", "anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saju*"]

[tool.setuptools.package-data]
"saju.report" = ["templates/*", "fonts/*"]
"saju.marketing" = ["data/*", "fonts/*", "video/*.html"]
"saju.marketing.formula" = ["banks.json", "judge_fixes.json", "assets/*.jpg", "assets/zodiac/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
