<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Gowun;src:url(../../saju/report/fonts/GowunBatang-Bold.ttf);font-weight:700}
@font-face{font-family:Gowun;src:url(../../saju/report/fonts/GowunBatang-Regular.ttf);font-weight:400}
@font-face{font-family:Song;src:url(../../saju/report/fonts/SongMyung-Regular.ttf)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#120d09;font-family:Gowun,serif;color:#fff}
.layer{position:absolute;inset:0;opacity:0}
.bg{position:absolute;inset:-4%;background-size:cover;background-position:center;will-change:transform}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,3,.55) 0%,rgba(10,6,3,0) 28%,rgba(10,6,3,0) 48%,rgba(10,6,3,.88) 78%,rgba(10,6,3,.95) 100%)}
.dark{position:absolute;inset:0;background:rgba(14,9,5,.72)}
#top{position:absolute;left:0;right:0;top:0;padding:64px 64px 0;display:flex;align-items:center;gap:22px;z-index:20}
.seal{width:92px;height:92px;background:#a8262b;color:#f6e7c8;font-family:Song;font-size:36px;line-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:6px;box-shadow:0 0 0 3px rgba(246,231,200,.25) inset}
.chip{font-size:34px;letter-spacing:2px;color:#f2d9a2;border:2px solid rgba(242,217,162,.6);padding:10px 24px;border-radius:99px;background:rgba(20,12,6,.45)}
#bar{position:absolute;left:0;top:0;height:10px;background:linear-gradient(90deg,#c9a14a,#f2d9a2);z-index:30}
.big{position:absolute;left:70px;right:70px;text-align:left}
.kicker{font-size:44px;color:#f2d9a2;letter-spacing:4px}
.title{font-size:150px;font-weight:700;line-height:1.08;text-shadow:0 8px 30px rgba(0,0,0,.6);margin-top:18px}
.title em{font-style:normal;color:#f7c873}
.hanja-row{position:absolute;top:470px;left:0;right:0;display:flex;justify-content:center;gap:70px}
.hj{width:330px;height:420px;border-radius:18px;background:linear-gradient(160deg,#f6ead2,#e4cfa5);color:#2a1a10;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 30px 60px rgba(0,0,0,.55)}
.hj b{font-family:Song;font-size:230px;line-height:1;font-weight:400}
.hj span{font-size:44px;margin-top:10px;color:#6b4a2b;font-weight:700}
.stamp{position:absolute;top:920px;left:50%;width:300px;height:300px;margin-left:-150px;border:12px solid #c0322f;color:#c0322f;border-radius:24px;display:flex;align-items:center;justify-content:center;font-family:Song;font-size:120px;background:rgba(246,234,210,.92);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.explain{position:absolute;top:1280px;left:80px;right:80px;font-size:52px;line-height:1.45;text-align:center;color:#f6ead2}
.explain em{font-style:normal;color:#f7c873;font-weight:700}
.list{position:absolute;left:80px;right:80px;top:560px;display:flex;flex-direction:column;gap:34px}
.item{display:flex;align-items:center;gap:30px;font-size:66px;font-weight:700;background:rgba(20,12,6,.62);border:2px solid rgba(242,217,162,.45);border-radius:22px;padding:34px 40px}
.item i{font-style:normal;width:96px;height:96px;flex:none;border-radius:50%;background:#a8262b;color:#f6e7c8;display:flex;align-items:center;justify-content:center;font-size:52px;font-family:Song}
.listhead{position:absolute;left:80px;top:400px;font-size:58px;color:#f2d9a2;font-weight:700}
#cap{position:absolute;left:60px;right:60px;bottom:250px;text-align:center;z-index:25;font-size:62px;font-weight:700;line-height:1.38;word-break:keep-all}
#cap .w{color:rgba(255,255,255,.42)}
#cap .w.on{color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.8)}
#cap .w.key.on{color:#f7c873}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px}
.end .seal{width:180px;height:180px;font-size:70px;line-height:80px;margin-bottom:60px}
.end h2{font-size:96px;line-height:1.25}
.end p{font-size:50px;color:#f2d9a2;margin-top:40px;line-height:1.5}
.end .url{margin-top:70px;font-size:46px;letter-spacing:2px;border:2px solid #f2d9a2;padding:18px 40px;border-radius:99px;color:#fff}
.dot{position:absolute;border-radius:50%;background:rgba(255,236,200,.85);filter:blur(1px);z-index:15}
</style></head><body>
<div id="bar"></div>
<div id="top"><div class="seal">운명<br>서재</div><div class="chip">2027 정미년 띠별 운세</div></div>

<div class="layer" id="s1"><div class="bg" style="background-image:url(../../site/public/assets/geumwol/palace-gate.jpg)"></div><div class="shade"></div>
  <div class="big" style="top:560px"><div class="kicker">54·66·78·90·02년생</div><div class="title">2027<br><em>말띠</em> 운세</div></div></div>

<div class="layer" id="s2"><div class="bg" style="background-image:url(../../site/public/assets/geumwol/newyear-cover.jpg)"></div><div class="shade"></div></div>

<div class="layer" id="s3"><div class="bg" style="background-image:url(../../site/public/assets/geumwol/palace-study.jpg)"></div><div class="dark"></div>
  <div class="hanja-row"><div class="hj" id="hj1"><b>午</b><span>말띠 · 오</span></div><div class="hj" id="hj2"><b>未</b><span>2027년 · 미</span></div></div>
  <div class="stamp" id="stamp">六合</div>
  <div class="explain" id="ex">두 글자가 짝처럼 맞는<br><em>육합(六合)</em> 관계</div></div>

<div class="layer" id="s4"><div class="bg" style="background-image:url(../../site/public/assets/geumwol/newyear-cover.jpg);background-position:center 20%"></div><div class="dark" style="background:rgba(14,9,5,.55)"></div>
  <div class="listhead">이런 사람을 만나요</div>
  <div class="list"><div class="item"><i>一</i>함께 일할 사람</div><div class="item"><i>二</i>연애할 사람</div><div class="item"><i>三</i>도와줄 사람</div></div></div>

<div class="layer" id="s5"><div class="bg" style="background-image:url(../../site/public/assets/geumwol/palace-garden.jpg)"></div><div class="dark" style="background:rgba(14,9,5,.6)"></div>
  <div class="listhead">이렇게 하세요</div>
  <div class="list"><div class="item"><i>✓</i>모임·소개 자리에 나가기</div><div class="item"><i>!</i>일주일에 하루는 비우기</div></div></div>

<div class="layer" id="s6"><div class="bg" style="background-image:url(../../site/public/assets/geumwol/palace-gate.jpg)"></div><div class="dark" style="background:rgba(14,9,5,.8)"></div>
  <div class="end"><div class="seal">운명<br>서재</div><h2>사람을 만나는<br>자리에 나가세요</h2><p>내 생년월일로 보는<br>2027 신년운세 한 권</p><div class="url">unmyeong-saju.com</div></div></div>

<div id="cap"></div>
<script>
const P = { lines: [], keys: ["말띠","손발이 맞는 사람","육합","만날 기회","하루는 비워","사람을 만나는"] };
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>1-Math.pow(1-clamp(x),3), $=s=>document.querySelector(s);
const dots=[...Array(26)].map((_,i)=>{const d=document.createElement('div');d.className='dot';const r=4+((i*37)%9);d.style.width=d.style.height=r+'px';document.body.appendChild(d);return {d,x:(i*211)%1080,s:30+(i*13)%50,ph:i*0.7};});
let built=-1;
function setCap(i, p){
  const L=P.lines[i]; if(!L){$('#cap').innerHTML='';return;}
  if(built!==i){ built=i;
    let html=L.cap; for(const k of P.keys) html=html.split(k).join('\u0001'+k+'\u0002');
    const out=[]; let key=false;
    for(const tok of html.split(/(\s+|\u0001|\u0002)/)){ if(tok==='\u0001'){key=true;continue} if(tok==='\u0002'){key=false;continue}
      if(/^\s+$/.test(tok)||!tok){out.push(tok===' '?' ':tok);continue}
      out.push(`<span class="w${key?' key':''}">${tok}</span>`);}
    $('#cap').innerHTML=out.join('');
  }
  const ws=[...document.querySelectorAll('#cap .w')]; const total=ws.reduce((n,w)=>n+w.textContent.length,0); let acc=0;
  for(const w of ws){ w.classList.toggle('on', acc/total <= p+0.02); acc+=w.textContent.length; }
}
window.render = function(t){
  const T=P.total, Ls=P.lines;
  $('#bar').style.width=(t/T*100)+'%';
  let li=Ls.findIndex(l=>t>=l.s&&t<l.e); if(li<0) li=t<Ls[0].s?0:Ls.length-1;
  const L=Ls[li]; setCap(li, clamp((t-L.s)/(L.e-L.s)));
  // 장면: 줄 번호 → 장면
  const sceneOf=[1,2,3,4,5,6], cur=sceneOf[li];
  for(let k=1;k<=6;k++){ const el=$('#s'+k); let op=0;
    const idx=sceneOf.indexOf(k), l=Ls[idx]; if(l){ op = k===cur? clamp((t-l.s)/0.35) : 0;
      const prev=sceneOf[li-1]; if(k===prev) op = 1-clamp((t-L.s)/0.35); }
    el.style.opacity=op; const bg=el.querySelector('.bg'); if(bg&&l){ const q=clamp((t-l.s)/(l.e-l.s+0.6)); bg.style.transform=`scale(${1.04+0.10*q}) translateY(${-q*28}px)`; } }
  // s1 제목
  { const l=Ls[0], q=(t-l.s); $('#s1 .big').style.transform=`translateY(${(1-ease(q/0.7))*80}px)`; $('#s1 .big').style.opacity=ease(q/0.6); }
  // s3 한자 카드와 도장
  { const l=Ls[2], q=t-l.s; $('#hj1').style.transform=`translateX(${-(1-ease(q/0.6))*600}px) rotate(${-(1-ease(q/0.6))*8}deg)`;
    $('#hj2').style.transform=`translateX(${(1-ease((q-0.25)/0.6))*600}px) rotate(${(1-ease((q-0.25)/0.6))*8}deg)`;
    const sq=(q-1.3)/0.35, s=sq<0?0:sq<1?2.2-1.2*ease(sq):1; $('#stamp').style.transform=`scale(${s}) rotate(-8deg)`; $('#stamp').style.opacity=sq<0?0:clamp(sq*2);
    $('#ex').style.opacity=ease((q-2.0)/0.5); $('#ex').style.transform=`translateY(${(1-ease((q-2)/0.5))*40}px)`; }
  // 목록 하나씩
  for(const [sid,li2] of [['#s4',3],['#s5',4]]){ const l=Ls[li2], q=t-l.s, its=[...document.querySelectorAll(sid+' .item')], gap=(l.e-l.s)/(its.length+1);
    its.forEach((it,i)=>{const a=ease((q-0.2-i*gap)/0.45); it.style.opacity=a; it.style.transform=`translateX(${(1-a)*-120}px)`;}); }
  { const l=Ls[5], q=t-l.s; const e=$('#s6 .end'); e.style.transform=`scale(${0.94+0.06*ease(q/0.8)})`; }
  for(const o of dots){ const y=1920-((t*o.s+o.ph*300)%2100); o.d.style.transform=`translate(${o.x+Math.sin(t*0.8+o.ph)*30}px,${y}px)`; o.d.style.opacity=0.25+0.35*Math.sin(t+o.ph)**2; }
  $('#cap').style.opacity = li===5 ? 1-clamp((t-L.s)/0.4) : 1;
};
window.setPlan = function(plan){ Object.assign(P, plan); built=-1; };
</script></body></html>
