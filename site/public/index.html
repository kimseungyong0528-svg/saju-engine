@font-face {
  font-family: 'Pretendard Variable';

:root {
  --ui-font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
  --page: #0a0a0a;
  --surface: #171717;

html { background: var(--page); color: var(--ink); font-family: var(--ui-font); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

button, input, select, textarea { font-family: var(--ui-font); }
h1,h2,h3,p,label,summary {word-break: keep-all; overflow-wrap: anywhere;letter-spacing:.02em;}

button,a,input,select,textarea { touch-action: manipulation; }

}

const INTAKE_POLICY_VERSION='kr-c-2026-10-10.2';
function intakePayload(productId,draft={}){
 const person=v=>{if(!v||typeof v!=='object')return {};const keys=['name','birth','calendar','leap','leapStatus','timeAccuracy','time','unknown','timeRange','birthPlace','sex'];return Object.fromEntries(keys.filter(k=>v[k]!==undefined).map(k=>[k,v[k]]));};
 return {productId,self:person(draft.self),partner:person(draft.partner),answers:draft.answers||{},question:typeof draft.question==='string'?draft.question.slice(0,1000):''};
}
function evaluateIntake(payload={},trusted={}){
 const product=PRODUCTS.find(p=>p.id===payload.productId),pair=['reunion','intimate'].includes(payload.productId);
 const outcome=(status,code,message,extra={})=>({policyVersion:INTAKE_POLICY_VERSION,status,code,message,inputAccepted:false,paymentAllowed:false,issuanceAllowed:false,requiresHumanReview:false,requiresAutomatedValidation:true,...extra});
 if(!product)return outcome('blocked','UNKNOWN_PRODUCT','현재 판매 중인 상품을 선택해주세요.');
 if(pair&&!payload.partner?.birth)return outcome('blocked','PARTNER_BIRTH_REQUIRED','두 사람의 분석에는 상대방 생년월일이 필요해요. 확인 전에는 이 상품을 구매할 수 없어요.',{person:'partner'});
 const inputs={};const uncertainties=[];
 for(const who of pair?['self','partner']:['self']){
  const p=payload[who]||{};const label=who==='self'?'나의':'상대방의';
  if(p.birthPlace?.countryCode&&p.birthPlace.countryCode!=='KR')return outcome('blocked','UNSUPPORTED_COUNTRY',`${label} 출생 국가를 확인해주세요. 현재 대한민국 출생만 지원해요.`,{person:who});
  const date=validateBirthDate(p);
  if(!date.valid)return outcome(date.code==='DATE_UNCONFIRMED'?'needs_confirmation':'blocked',date.code||'INVALID_BIRTH_DATE',`${label} ${date.message}`,{person:who});
  if(!birthPlaceValid(p.birthPlace))return outcome('needs_confirmation','PLACE_REQUIRED',`${label} 국내 출생 지역을 선택하거나 모름으로 표시해주세요.`,{person:who});
  const timeError=birthRangeError(p);
  if(timeError)return outcome('needs_confirmation','TIME_REQUIRED',`${label} ${timeError}`,{person:who});
  if(!personValid(p))return outcome('needs_confirmation','PERSON_REQUIRED',`${label} 이름과 성별을 확인해주세요.`,{person:who});
  if(birthPrecision(p)!=='exact')uncertainties.push({person:who,kind:'time',message:`${label} 가능한 출생 시간 전체에서 공통 풀이와 달라지는 풀이를 확인해야 해요.`});
  if(p.birthPlace.status!=='known'||p.birthPlace.inputMode==='manual')uncertainties.push({person:who,kind:'place',message:`${label} 출생 지역에 따른 결과 차이를 확인해야 해요.`});
  inputs[who]=birthAnalysisInput(p);
 }
 for(const step of FLOWS[product.id].filter(s=>s.type==='choice')){
  const answer=payload.answers?.[step.id];
  if((step.required&&!answer)||(answer&&!step.options.includes(answer)))return outcome('needs_confirmation','QUESTION_REQUIRED','상품의 질문에 알맞은 답변을 선택해주세요.',{stepId:step.id});
 }

 // Coverage must be supplied by the trusted server adapter, bound to this exact input.
 const a=trusted.assessment;
 if(!a||!trusted.inputFingerprint||a.inputFingerprint!==trusted.inputFingerprint||a.policyVersion!==INTAKE_POLICY_VERSION)return outcome('awaiting_analysis','ANALYSIS_REQUIRED','입력은 확인했어요. 제공 가능한 풀이 범위의 검증이 끝난 뒤 구매할 수 있어요. 아직 결제나 주문은 생성되지 않았어요.',info);
 if(a.summary)info.analysisSummary=a.summary;
 if(a.calculationConflict!==false)return outcome('needs_review','CALCULATION_CONFLICT','계산 기준에 따른 결과 차이를 확인 중이에요. 확인 전에는 결제나 결과 발행을 진행하지 않아요.',info);
 if(a.coreCoverage!=='complete')return outcome('blocked','CORE_COVERAGE_INCOMPLETE',a.summary?.calculated?'명식 후보와 일부 구조 조건을 계산했어요. 이 상품의 전체 풀이 규칙과 자동 검증이 준비되기 전에는 구매할 수 없어요.':'현재 정보로는 이 상품의 핵심 분석을 제공할 수 없어 구매를 진행할 수 없어요.',info);
 if(uncertainties.length&&a.allPossibleVariantsEvaluated!==true)return outcome('needs_review','VARIANT_REVIEW_REQUIRED','불확실한 시간과 지역의 가능성을 모두 비교한 뒤 구매 가능 여부를 안내할게요.',info);
 if(!Array.isArray(a.disclosures)||a.disclosures.some(x=>typeof x!=='string')||(uncertainties.length&&!a.disclosures.length))return outcome('needs_review','DISCLOSURES_REQUIRED','제외되는 풀이와 달라지는 내용을 먼저 확인해야 해요.',info);
 if(!a.calculationVersion||!a.coverageVersion)return outcome('needs_review','EVIDENCE_REQUIRED','계산과 분석 범위의 검증 기록을 확인 중이에요.',info);
 return outcome('eligible','CORE_COVERAGE_CONFIRMED','상품의 핵심 분석을 제공할 수 있어요. 안내된 제한 사항을 확인해주세요.',{...info,paymentAllowed:true,disclosures:a.disclosures});
}

async function createCustomerOrder(productId,draft,{fetcher=fetch,storage=sessionStorage,uuid=()=>crypto.randomUUID()}={}){
 const fingerprint=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify({productId,...draft})))),b=>b.toString(16).padStart(2,'0')).join(''),slot='unmyeong.order-attempt.'+productId;let saved;try{saved=JSON.parse(storage.getItem(slot));}catch{}
 if(!saved||saved.fingerprint!==fingerprint)saved={key:uuid(),fingerprint};storage.setItem(slot,JSON.stringify(saved));

function bindReadyCheckout(area,product,draft){if(!area||area.querySelector('[data-start-payment]'))return;const button=document.createElement('button');button.type='button';button.className='primary dark-primary';button.dataset.startPayment='true';button.hidden=true;button.style.display='none';button.textContent='결제하기';button.onclick=async()=>{button.disabled=true;try{await startHostedCheckout(product.id,draft);}catch(e){let note=area.querySelector('[data-checkout-error]');if(!note){note=document.createElement('p');note.dataset.checkoutError='true';note.setAttribute('role','status');area.append(note);}note.textContent=e.message==='TEST_MODE_OWNER_ONLY'?'지금은 시험 운영 중이라 결제할 수 없어요. 곧 정식으로 문을 열어요.':e.message==='COUPON_INVALID'?'재구매 할인 링크를 확인하지 못했어요. 리포트 안의 링크로 다시 들어와 결제해주세요.':e.message==='BUNDLE_INCOMPLETE'?((typeof showBundleGap==='function'&&showBundleGap())||'함께 살 리포트의 질문(재회사주·깊은 궁합은 상대방 정보)을 채워 주세요. 사지 않으려면 그 상품의 체크를 풀어 주세요.'):e.message==='EMAIL_REQUIRED'?'이메일 주소를 다시 확인해 주세요. 끝(.com, .net)까지 넣어야 해요. 예: name@naver.com':'현재 결제를 시작할 수 없어요. 결제 준비 상태와 주문을 확인한 뒤 다시 시도해주세요.';button.disabled=false;}};area.append(button);}
function intakeNotice(decision,productId){if(decision.inputAccepted)return '';

 const target=decision.person||'self';
 const step=decision.stepId||(target==='partner'?'partner':'info');
 return `<div class="intake-decision" data-intake-status="${e(decision.status)}" role="status"><strong>${decision.paymentAllowed?'분석 범위 확인 완료':decision.inputAccepted?'입력 확인 완료 · 분석 범위 확인 필요':'입력 정보를 확인해주세요'}</strong><p>${e(decision.message)}</p>${(decision.uncertainties||[]).map(item=>`<p>${e(item.message)}</p>`).join('')}${(decision.disclosures||[]).map(text=>`<p>${e(text)}</p>`).join('')}<p class="fine-print">결제 후 사주 결과를 작성하고 자동 검사를 거쳐 이메일로 보내드려요.</p>${!decision.inputAccepted?`<a class="text-button" href="#/f/${e(productId)}/${e(step)}">정보 확인하기</a>`:''}</div>`;

async function requestIntake(productId,draft,{fetcher=globalThis.fetch,protocol=globalThis.location?.protocol}={}){
 const payload=intakePayload(productId,draft),local=evaluateIntake(payload);

 try{
  const response=await fetcher('/api/intake/assess',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(10000)});
  if(!response.ok)throw Error('Intake unavailable');
  const result=await response.json();
  if(result.policyVersion!==local.policyVersion||typeof result.inputAccepted!=='boolean'||typeof result.paymentAllowed!=='boolean'||typeof result.message!=='string')throw Error('Invalid decision');
  return result;
 }catch{return {...local,status:'connection_required',code:'SERVER_UNAVAILABLE',paymentAllowed:false,message:'접수 확인 서버에 연결하지 못했어요. 입력은 브라우저에 보관되며, 연결이 확인되기 전에는 결제나 주문을 만들지 않아요.'};}
}

function freePage(){const c=context;if(freeState.stage==='form'){c.layout('무료 사주',`<div class="page-pad free-intro"><span class="eyebrow">A LITTLE DISCOVERY</span><h1>내 안의<br>또 다른 나</h1><p class="muted">사주팔자, 운명지도, 인생의 흐름.<br>나를 알아가는 세 가지 이야기.</p><span class="pill">무료 · 결과 화면 예시</span><form id="free-form">${c.personFields('free',freeState.person)}<div class="field"><label for="mbti">MBTI <small>선택</small></label><select id="mbti" name="mbti"><option value="">아직 몰라요</option>${options(['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'],freeState.person.mbti)}</select></div><div class="field"><label for="blood">혈액형 <small>선택</small></label><select id="blood" name="blood"><option value="">선택 안 함</option>${options(['A형','B형','O형','AB형'],freeState.person.blood)}</select></div><div class="field"><label for="constitution">사상 체질 <small>선택</small></label><select id="constitution" name="constitution"><option value="">선택 안 함</option>${options(['태양인','태음인','소양인','소음인'],freeState.person.constitution)}</select></div><div class="notice">현재 결과는 화면 예시예요. 출생 정보로 실제 사주를 계산하거나 AI 분석을 진행하지 않아요.</div><button class="primary" id="free-submit" disabled>무료 결과 살펴보기</button></form></div>`);const f=document.querySelector('#free-form');c.bindPerson(f,(v,valid)=>document.querySelector('#free-submit').disabled=!valid);f.onsubmit=e=>{e.preventDefault();if(!f.checkValidity()||!c.personValid(c.readPerson(f)))return f.reportValidity();freeState.person={...c.readPerson(f),mbti:f.elements.mbti.value,blood:f.elements.blood.value,constitution:f.elements.constitution.value};loading('무료 사주',['입력한 이야기 확인','사주팔자 화면 준비','운명지도 펼치기','인생등급 화면 준비'],()=>{freeState.stage='result';store('free',freeState);freePage()})};return}
const name=c.esc(freeState.person.name||'당신');c.layout('나의 무료 사주',`<div class="result-tabs">${[['사주팔자','만세력 풀이'],['운명지도','나라는 사람'],['인생등급','전생·운세']].map(([a,b],i)=>`<button class="${freeState.tab===i?'active':''}" data-free-tab="${i}"><strong>${a}</strong><small>${b}</small></button>`).join('')}</div><div class="page-pad"><div class="sample-strip">모든 수치와 풀이는 예시입니다</div><div class="today-card"><span>오늘을 위한 작은 질문</span><strong>지금 나에게 필요한 건 무엇일까요?</strong><p>잠시 멈추고 내 마음을 돌아보는 시간을 가져보세요.</p></div>${freeState.tab===0?`<div class="result-title"><span class="eyebrow">MY NATURE</span><h1>${name}님의<br>사주팔자</h1></div><div class="sample-pillars">${['시주','일주','월주','연주'].map(t=>`<div><small>${t}</small><b>${t==='시주'&&freeState.person.unknown?'?':'—'}</b><b>${t==='시주'&&freeState.person.unknown?'?':'—'}</b></div>`).join('')}</div><p class="fine-print">출생 시간 미상은 물음표로 표시해요. 원국 계산은 서비스 연결 후 제공됩니다.</p><section class="result-block"><h2>나의 오행 분포</h2><p>아래 분포는 차트 디자인 예시예요.</p>${bars()}</section><section class="result-block"><h2>나를 이해하는 키워드</h2><div class="tags"><span>나의 속도</span><span>균형</span><span>새로운 시선</span></div><p>정식 분석에서는 성향과 강점, 일상에서 드러나는 관계의 방식을 개인별로 안내할 예정입니다.</p></section><details class="result-block"><summary>격국과 신살 안내</summary><p>정식 원국 계산 결과에 따라 격국, 십신, 신살을 설명하는 영역입니다. 현재는 특정 결과를 표시하지 않습니다.</p></details>`:freeState.tab===1?`<div class="result-title"><span class="eyebrow">MY INNER MAP</span><h1>${name}님의<br>운명지도</h1><p>나를 설명하는 여러 가지 언어</p></div><div class="keyword-card"><span>나를 알아가는 시간</span><h2>천천히,<br>나만의 방향으로</h2><p>잘하는 것과 좋아하는 것 사이에서<br>나의 균형을 찾아보세요.</p></div><section class="result-block"><h2>관계 속의 나</h2><p>편안한 관계에서 내가 어떤 모습을 보이는지 떠올려 보세요. 상대의 말보다 내 추측이 앞서고 있지는 않은지도 돌아볼 수 있어요.</p></section><details class="result-block"><summary>인생의 흐름 펼쳐보기</summary>${lifeChart()}<p>그래프는 화면 예시이며 실제 운세를 나타내지 않습니다.</p></details><div class="button-row"><button class="secondary" id="save-result">결과 카드 저장</button><button class="secondary" id="share-result">공유하기</button></div>`:`${freeState.past?`<div class="past-card"><span class="eyebrow">A STORY FROM ANOTHER TIME</span><span class="past-mark">前生</span><h1>마음을 기록하던 사람</h1><p>작은 일상을 놓치지 않고 글로 남기던 당신. 말보다 오래 남는 기록으로 사람들의 마음을 이어주던 이야기.</p><div class="tags"><span>#기록하는마음</span><span>#조용한관찰</span><span>#이야기</span></div><p class="fine-print">전생 결과 화면을 위한 공통 예시입니다.</p><button class="secondary" id="past-back">인생등급으로 돌아가기</button><button class="primary" id="share-result">전생 이야기 공유하기</button></div>`:`<div class="result-title"><span class="eyebrow">MY LIFE CHAPTER</span><h1>다음 계절의 나</h1></div><div class="grade-card"><span id="age-label">${freeState.age}세의 나</span><strong>B</strong><h2>차곡차곡 쌓아가는 시간</h2><p>등급은 화면 예시입니다</p></div><div class="grade-grid">${['재물','연애','직업','건강'].map((n,i)=>`<div><small>${n}</small><strong>${['B','A','B','A'][i]}</strong></div>`).join('')}</div><div class="field age-control"><label for="age-slider">다른 나이의 화면 살펴보기</label><input type="range" id="age-slider" min="10" max="90" value="${freeState.age}"><div><span>10세</span><span>90세</span></div></div><button class="scroll-button" id="past-open"><span>前生</span><strong>나의 전생 이야기</strong><small>두루마리를 펼쳐보세요</small></button><details class="result-block"><summary>사주팔자 · 오행 분포</summary>${bars()}</details>`}`}</div><div class="page-pad free-end"><a class="primary" href="#/support">조금 더 깊은 이야기 물어보기</a><button class="text-button" id="free-reset">처음부터 다시 보기</button><p class="fine-print">가볍게 나를 돌아보는 콘텐츠입니다.<br>현재는 실제 개인 분석을 제공하지 않는 미리보기예요.</p></div>`);
document.querySelectorAll('[data-free-tab]').forEach(b=>b.onclick=()=>{freeState.tab=Number(b.dataset.freeTab);freeState.past=false;store('free',freeState);freePage()});document.querySelector('#free-reset').onclick=()=>{freeState.stage='form';store('free',freeState);freePage();window.scrollTo(0,0)};document.querySelector('#age-slider')?.addEventListener('input',e=>{freeState.age=Number(e.target.value);document.querySelector('#age-label').textContent=freeState.age+'세의 나';store('free',freeState)});document.querySelector('#past-open')?.addEventListener('click',()=>{c.modal(`<div class="unroll"><span>前生</span><h2>오래된 이야기 한 장</h2><p>당신의 다른 이야기를 펼쳐보세요.</p><button class="primary" id="unroll">두루마리 펼치기</button></div>`);document.querySelector('#unroll').onclick=()=>{c.closeModal();freeState.past=true;store('free',freeState);freePage()}});document.querySelector('#past-back')?.addEventListener('click',()=>{freeState.past=false;store('free',freeState);freePage()});document.querySelector('#save-result')?.addEventListener('click',()=>saveCard(freeState.person.name));document.querySelector('#share-result')?.addEventListener('click',()=>shareLocation('/free','내 안의 또 다른 나'))}
function bars(){return `<div class="element-bars">${[['목',20,'#5f9b7b'],['화',30,'#c87471'],['토',15,'#b59a68'],['금',10,'#b9bac7'],['수',25,'#6b92b8']].map(([n,v,color])=>`<div><span>${n}</span><i><b style="width:${v*2}%;background:${color}"></b></i><strong>${v}%</strong></div>`).join('')}</div>`}
function lifeChart(){return `<svg class="life-chart" viewBox="0 0 340 150" role="img" aria-label="인생 흐름 그래프 예시"><path d="M15 110H325M15 75H325M15 40H325" stroke="#ffffff17"/><path d="M15 105Q45 95 65 75T115 95T165 52T215 66T265 35T325 25" fill="none" stroke="#c5a3d8" stroke-width="3"/>${[20,30,40,50,60,70].map((v,i)=>`<text x="${15+i*58}" y="140" fill="#918b9b" font-size="10">${v}대</text>`).join('')}</svg>`}
function saveCard(name){const c=context,xml=v=>c.esc(v);const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1000"><rect width="750" height="1000" fill="#16111e"/><rect x="30" y="30" width="690" height="940" rx="30" fill="none" stroke="#4b3b5d"/><text x="65" y="115" fill="#c9a7df" font-size="25" font-family="sans-serif">운명서재 · 화면 예시</text><text x="65" y="270" fill="#eee7f3" font-size="52" font-family="sans-serif">${xml(name||'나')} 님의 운명지도</text><text x="65" y="460" fill="#d9c9e4" font-size="55" font-family="sans-serif">천천히,</text><text x="65" y="540" fill="#d9c9e4" font-size="55" font-family="sans-serif">나만의 방향으로</text><text x="65" y="850" fill="#a59bab" font-size="23" font-family="sans-serif">실제 사주 분석이 아닌 예시 콘텐츠입니다.</text></svg>`;const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='unmyeong-sample-card.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);c.toast('예시 결과 카드를 저장했어요.')}
async function shareLocation(route,title){const c=context;if(location.protocol==='file:'){c.modal('<h2>게시 후 링크를 나눌 수 있어요</h2><p>지금은 내 컴퓨터에서 여는 미리보기 파일입니다. 웹 주소가 연결되면 콘텐츠 공유를 사용할 수 있어요.</p><button class="primary" data-action="close">확인</button>');return}const url=location.origin+location.pathname+'#'+route;try{if(navigator.share)await navigator.share({title,url});else{await navigator.clipboard.writeText(url);c.toast('콘텐츠 링크를 복사했어요.')}}catch(e){if(e.name!=='AbortError')c.modal(`<h2>콘텐츠 링크</h2><input class="share-url" readonly value="${c.esc(url)}"><p>링크를 선택해 복사할 수 있어요.</p><button class="primary" data-action="close">확인</button>`)}}
function friendsPage(){const c=context;if(friendState.stage==='form'){c.layout('우리의 인연 우주',`<div class="page-pad friends-intro"><span class="eyebrow">OUR UNIVERSE</span><h1>우리는 어떤<br>인연일까요?</h1><p class="muted">나의 작은 공간을 만들고<br>함께한 사람들의 이야기를 모아보세요.</p><div class="friend-orbits" aria-hidden="true"><span>나</span><i>친구</i><b>인연</b></div><form id="friend-form">${c.personFields('friend',friendState.person)}<div class="field"><label for="friend-mbti">MBTI <small>선택</small></label><select id="friend-mbti"><option value="">선택 안 함</option>${options(['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'])}</select></div><label class="check-line"><input id="friend-consent" type="checkbox" required>미리보기 정보 이용 안내를 확인했어요</label><label class="check-line"><input type="checkbox">소식 받기 <small>선택 · 연결 전</small></label><p class="local-note">입력 정보는 이 브라우저 세션에만 저장돼요.</p><button type="button" class="kakao" id="kakao-login">카카오로 시작하기</button><button class="secondary" id="friend-demo" disabled>로그인 없이 체험 공간 만들기</button></form></div>`);const f=document.querySelector('#friend-form');let valid=false;const refresh=()=>document.querySelector('#friend-demo').disabled=!(valid&&document.querySelector('#friend-consent').checked);c.bindPerson(f,(_,v)=>{valid=v;refresh()});document.querySelector('#friend-consent').onchange=refresh;document.querySelector('#kakao-login').onclick=()=>c.modal('<h2>카카오 로그인 연결 전이에요</h2><p>지금은 로그인 없이 이 브라우저에서 체험 공간을 만들 수 있어요. 실제 친구 초대와 다른 기기에서의 조회는 연결 후 제공됩니다.</p><button class="primary" data-action="close">확인</button>');f.onsubmit=e=>{e.preventDefault();if(!f.checkValidity()||!c.personValid(c.readPerson(f)))return f.reportValidity();friendState.person=c.readPerson(f);friendState.stage='space';store('friends',friendState);friendsPage()};return}
c.layout('우리의 인연 우주',`<div class="page-pad"><div class="result-title"><span class="eyebrow">MY LITTLE UNIVERSE</span><h1>${c.esc(friendState.person.name)} 님의<br>인연 우주</h1><p>이 브라우저에서만 보이는 체험 공간</p></div><div class="universe"><div class="universe-me">${c.esc(friendState.person.name)}</div>${friendState.members.map((m,i)=>`<button class="universe-friend" style="--angle:${i*90+30}deg" data-member="${i}"><span>${c.esc(m)}</span></button>`).join('')}</div><button class="primary" id="add-friend">체험 친구 추가하기</button><button class="secondary" id="friend-invite">친구 초대 안내</button><div class="notice">다른 사람의 출생 정보는 입력하지 않아요. 현재는 별명으로 공간의 동작만 체험할 수 있어요.</div><div class="friend-list">${friendState.members.map((m,i)=>`<button data-member="${i}"><span>${c.esc(m)}</span><small>관계 예시 살펴보기</small>${c.icon('chevron')}</button>`).join('')}</div><button class="text-button" id="friend-reset">처음으로 돌아가기</button></div>`);document.querySelector('#add-friend').onclick=()=>{if(friendState.members.length>=4)return c.toast('체험 공간에는 네 명까지 추가할 수 있어요.');c.modal('<h2>친구의 별명을 알려주세요</h2><form id="add-friend-form"><input name="nickname" maxlength="12" placeholder="예: 오랜 친구" required><button class="primary">체험 친구 추가</button></form>');document.querySelector('#add-friend-form').onsubmit=e=>{e.preventDefault();const value=new FormData(e.target).get('nickname').trim();if(!value)return;friendState.members.push(value);store('friends',friendState);c.closeModal();friendsPage()}};document.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>c.modal(`<span class="eyebrow">OUR STORY · SAMPLE</span><h2>${c.esc(friendState.person.name)}와 ${c.esc(friendState.members[Number(b.dataset.member)])}</h2><p>서로의 공통점과 차이, 함께할 때 편안한 모습을 보여줄 자리예요. 현재는 궁합 점수를 계산하지 않습니다.</p><a class="primary" href="#/f/intimate/intro" data-action="close">깊은 궁합 살펴보기</a>`));document.querySelector('#friend-invite').onclick=()=>c.modal('<h2>친구 초대는 준비 중이에요</h2><p>카카오 로그인과 공간 저장 기능을 연결하면, 친구가 자신의 정보를 직접 입력하는 초대 링크를 만들 수 있어요.</p><button class="primary" data-action="close">확인</button>');document.querySelector('#friend-reset').onclick=()=>{friendState.stage='form';store('friends',friendState);friendsPage()}}
function birthPage(){const c=context;if(birthState.stage==='form'){c.layout('태어난 시간 찾기',`<div class="page-pad birth-intro"><span class="eyebrow">FIND MY TIME</span><h1>태어난 시간을<br>모르고 있나요?</h1><p class="muted">나의 성향과 지난 시간을 돌아보며<br>결과 화면을 체험해보세요.</p><div class="sample-pillars">${['?','日','月','年'].map(s=>`<div><b>${s}</b></div>`).join('')}</div><form id="birth-form">${c.personFields('birth',{...birthState.person,timeAccuracy:birthState.person.timeAccuracy||'unknown',unknown:birthState.person.timeAccuracy?birthState.person.timeAccuracy==='unknown':true})}<div class="field"><span class="field-label">기억나는 시간대가 있나요?</span><div class="choices">${[['am','오전에 태어났어요'],['pm','오후에 태어났어요'],['unknown','전혀 모르겠어요']].map(([v,s])=>`<label class="choice"><input type="radio" name="hint" value="${v}" ${birthState.hint===v?'checked':''}><span>${s}</span><i></i></label>`).join('')}</div></div><div class="notice">현재는 질문과 후보 결과의 화면 예시입니다. 실제 출생 시간을 추정하지 않아요.</div><button class="primary" id="birth-submit" disabled>질문 시작하기</button></form></div>`);const f=document.querySelector('#birth-form');c.bindPerson(f,(_,valid)=>document.querySelector('#birth-submit').disabled=!valid);f.onsubmit=e=>{e.preventDefault();if(!f.checkValidity()||!c.personValid(c.readPerson(f)))return f.reportValidity();birthState.person=c.readPerson(f);birthState.hint=f.elements.hint.value;birthState.answers=[];loading('태어난 시간 찾기',['알고 있는 정보 확인','시간 후보 화면 준비','나에 관한 질문 펼치기'],()=>{birthState.stage='quiz';store('birth',birthState);birthPage()})};return}
if(birthState.stage==='quiz'){const n=birthState.answers.length;if(n>=BIRTH_QUESTIONS.length){birthState.stage='result';store('birth',birthState);return birthPage()}c.layout('태어난 시간 찾기',`<div class="birth-quiz page-pad"><div class="quiz-top"><button id="question-back" class="icon-btn" aria-label="이전 질문">${c.icon('back')}</button><span>${birthState.hint==='unknown'?12:6}개 후보 · 예시</span><small>${n+1} / ${BIRTH_QUESTIONS.length}</small></div><div class="quiz-progress"><i style="width:${n/BIRTH_QUESTIONS.length*100}%"></i></div><div class="question-card"><span class="eyebrow">QUESTION ${String(n+1).padStart(2,'0')}</span><h1>${BIRTH_QUESTIONS[n]}</h1><p>나와 얼마나 비슷한가요?</p></div><div class="quiz-answers">${[['no','×','아니다'],['unknown','?','잘 몰라요'],['yes','○','그렇다']].map(([v,s,t])=>`<button data-birth-answer="${v}"><strong>${s}</strong><span>${t}</span></button>`).join('')}</div></div>`);document.querySelectorAll('[data-birth-answer]').forEach(b=>b.onclick=()=>{birthState.answers.push(b.dataset.birthAnswer);store('birth',birthState);birthPage()});document.querySelector('#question-back').onclick=()=>{if(birthState.answers.length)birthState.answers.pop();else birthState.stage='form';store('birth',birthState);birthPage()};return}
const times=['23:30~01:30','01:30~03:30','03:30~05:30','05:30~07:30','07:30~09:30','09:30~11:30','11:30~13:30','13:30~15:30','15:30~17:30','17:30~19:30','19:30~21:30','21:30~23:30'],zodiac=['자시','축시','인시','묘시','진시','사시','오시','미시','신시','유시','술시','해시'];let indices=birthState.hint==='am'?[0,1,2,3,4,5]:birthState.hint==='pm'?[6,7,8,9,10,11]:Array.from({length:12},(_,i)=>i);const known=birthState.answers.filter(a=>a!=='unknown').length;c.layout('시간 후보 결과',`<div class="page-pad birth-result"><span class="eyebrow">YOUR TIME · SAMPLE</span><h1>태어난 시간의<br>후보를 살펴봐요</h1><div class="sample-strip">실제 추정 확률이 아닌 화면 예시</div><div class="podium">${[1,0,2].map((rank)=>{const i=indices[rank];return `<div class="${rank===0?'first':''}"><small>${rank+1}위 예시</small><strong>${zodiac[i]}</strong><span>${times[i]}</span><b>${Math.round(100/indices.length)}%</b></div>`}).join('')}</div><div class="notice">${known===0?'모든 질문에 잘 모르겠다고 답했어요. 후보를 구분할 근거가 없어요.':'질문에 답한 내용을 바탕으로 결과 화면의 구성을 확인할 수 있어요.'} 현재 수치는 후보 수를 균등하게 나눈 예시이며, 출생 기록을 대신하지 않습니다.</div><h2>후보별 이야기</h2>${indices.slice(0,5).map((i,n)=>`<details class="result-block" ${n===0?'open':''}><summary>${n+1}위 예시 · ${zodiac[i]} <small>${times[i]}</small></summary><p>정식 서비스에서는 이 시간대를 후보로 판단한 이유와 다른 후보와의 차이를 설명합니다. 현재는 특정 시주나 운세를 확정하지 않아요.</p></details>`).join('')}<div class="result-title"><h2 class="serif">시간을 몰라도<br>이야기를 시작할 수 있어요</h2><p>시간 미상을 선택하고 평생사주를 살펴보세요.</p></div><a class="primary" href="#/f/lifetime/intro">평생사주 살펴보기</a><button class="text-button" id="birth-reset">처음부터 다시 하기</button><p class="fine-print">실제 출생 기록이 있다면 그 기록을 우선해주세요.</p></div>`);document.querySelector('#birth-reset').onclick=()=>{birthState.stage='form';birthState.answers=[];store('birth',birthState);birthPage()}}

function monthlyPage(selected=0){const c=context,month=new Date().getMonth()+1,year=new Date().getFullYear(),[name,han,line]=stems[selected];c.layout('월간 운세',`<div class="monthly-hero"><span class="eyebrow">${year} · MONTHLY LETTER</span><h1>${month}월,<br>나에게 보내는 편지</h1><p>이번 달을 천천히 시작하는 열 가지 이야기</p><span class="month-number">${String(month).padStart(2,'0')}</span></div><div class="page-pad"><div class="sample-strip">일간별 운세 페이지의 예시 콘텐츠</div><section class="result-block"><h2>한 달의 시작에서</h2><p>새로운 계획을 더하기 전에, 지금 이어가고 싶은 일과 내려놓고 싶은 일을 구분해보세요. 작은 선택을 기록하는 것이 한 달을 돌아보는 기준이 될 수 있어요.</p></section><h2 class="subheading">나의 일간을 선택하세요</h2><p class="muted">일간은 태어난 해의 띠와 달라요.</p><div class="stem-tabs">${stems.map(([k,h],i)=>`<button data-stem="${i}" class="${i===selected?'active':''}"><strong>${h}</strong><span>${k}목${i>1?'':''}</span></button>`.replace(k+'목'+(i>1?'':''),k+(['목','목','화','화','토','토','금','금','수','수'][i]))).join('')}</div><article class="stem-result"><span class="stem-han">${han}</span><span class="eyebrow">${name} 일간의 ${month}월 · 예시</span><h2>${line}</h2><div class="monthly-scores">${['종합','재물','연애','직업'].map((t,i)=>`<div><span>${t}</span><b>${['★★★','★★★★','★★★','★★★★'][i]}</b></div>`).join('')}</div><p>이번 달에는 나의 속도를 돌아보는 질문을 남겨보세요. 어떤 환경에서 편안하고, 어떤 일을 할 때 에너지가 생기는지 기록해보는 시간입니다.</p>${[['재물','수입과 지출을 적어보고, 나에게 필요한 소비의 기준을 세워보세요.'],['연애와 관계','추측하기보다 질문하고, 서로 편안한 대화의 속도를 찾아보세요.'],['직업과 일상','새로운 목표 하나보다 지금 이어갈 수 있는 작은 습관을 정해보세요.']].map(([h,t])=>`<section><h3>${h}</h3><p>${t}</p></section>`).join('')}<div class="date-cards"><div><span>돌아보는 날 · 예시</span><strong>7 · 16 · 25일</strong></div><div><span>쉬어가는 날 · 예시</span><strong>10 · 22일</strong></div></div><blockquote>나만의 속도로 한 달을 채워보세요.</blockquote></article><details class="result-block"><summary>열 가지 일간 한 번에 보기</summary>${stems.map(([n,h,l])=>`<p><b>${h} ${n}</b> · ${l}</p>`).join('')}</details><a class="primary" href="#/f/lifetime/intro">나의 긴 이야기, 평생사주</a><a class="secondary" href="#/support">궁금한 점 물어보기</a></div>`);document.querySelectorAll('[data-stem]').forEach(b=>b.onclick=()=>monthlyPage(Number(b.dataset.stem)))}

const storyAsset=path=>globalThis.__UNMYEONG_EMBEDDED_ASSETS__?.[path]||path;

// A persistent portrait: unchanged neural eyes/smile and one gentle vertical float.
function portraitMarkup(p,m,escape){
 const f=STORY_FACES[p.id],n=f.neural,sm=f.smile;
 return `<svg class="story-person-image" viewBox="0 0 1024 1536" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${escape(p.guide)}">
 <g class="story-person-rig" transform="translate(0 0)">
 <image class="story-person-base" href="${escape(storyAsset(m.character))}" width="1024" height="1536"/>
 <svg class="story-eye-window" x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" viewBox="0 0 ${n.width} ${n.height}" overflow="hidden" visibility="hidden" aria-hidden="true">
 <image class="story-neural-frames" href="${escape(storyAsset(n.atlas))}" x="0" y="0" width="${n.width*n.frames}" height="${n.height}" data-frame="0"/>
 </svg>
 <svg class="story-smile-window" x="${sm.x}" y="${sm.y}" width="${sm.width}" height="${sm.height}" viewBox="0 0 ${sm.width} ${sm.height}" overflow="hidden" visibility="hidden" aria-hidden="true">
 <image class="story-smile-frames" href="${escape(storyAsset(sm.atlas))}" x="0" y="0" width="${sm.width*sm.frames}" height="${sm.height}" data-frame="0"/>
 </svg></g>
 </svg>`;
}

function storyMarkup(p,s,escape){
 const m=STORY_MEDIA[p.id+'.'+s.id];if(!m)return '';
 return `<section class="scene-art art has-art layered-story ${p.tone}" data-art-key="${p.id}.${s.id}" data-product="${p.id}" data-story-phase="loading" style="--accent:${p.color};--person-width:${m.width||112}%;--person-offset:${-(m.width||112)/2+50}%;--person-top:${m.top||68}px">
 <div class="story-background"><img class="story-background-image is-current" src="${escape(storyAsset(m.background))}" data-background="${escape(m.background)}" alt="${escape(m.backgroundAlt)}" decoding="async" fetchpriority="high"></div>
 <div class="story-person-position">${portraitMarkup(p,m,escape)}</div>
 <div class="story-shade" aria-hidden="true"></div>
 <div class="scene-eyebrow"><span>運命書齋</span></div>
 <div class="scene-copy" aria-live="polite" aria-hidden="true"><span class="scene-name">${p.guide}</span><h1>${s.title.replaceAll('\n','<br>')}</h1><div class="story-speech"><p class="scene-dialog">${s.text}</p></div></div>
 </section>`;
}

function startStory(stage,{product,scene,advance,preload=[],resume}={}){
 let disposed=false,leaving=false,revision=0,blinkReady=false,smileReady=false,personReady=false,clock=resume?.clock||0,lastTime=null,lastPaint=-50,frame=null;
 let nextBlink=resume?.nextBlink??1000,blinkIndex=resume?.blinkIndex||0,blinkStart=null,activeAdvance=advance,currentScene=scene;
 const timers=new Set(),cleanups=[],pendingLoads=new Set(),uiTimers=new Set();
 const shell=stage.closest('.scene-flow'),button=shell.querySelector('[data-next]'),back=shell.querySelector('.back-square');
 const copy=stage.querySelector('.scene-copy'),background=stage.querySelector('.story-background'),portrait=stage.querySelector('.story-person-position');
 const eyelids=stage.querySelector('.story-neural-frames'),eyeWindow=stage.querySelector('.story-eye-window'),motionButton=shell.querySelector('[data-story-motion]');
 const neural=STORY_FACES[stage.dataset.product].neural;
 const smile=STORY_FACES[stage.dataset.product].smile,smileFrames=stage.querySelector('.story-smile-frames'),smileWindow=stage.querySelector('.story-smile-window'),rig=stage.querySelector('.story-person-rig');
 const query=window.matchMedia?.('(prefers-reduced-motion: reduce)'),reduced=()=>!!query?.matches||storyStopped;
 const later=(fn,ms,ui=false)=>{const id=setTimeout(()=>{timers.delete(id);uiTimers.delete(id);if(!disposed)fn()},ms);timers.add(id);if(ui)uiTimers.add(id);return id};
 const cancelUI=()=>{for(const id of uiTimers){clearTimeout(id);timers.delete(id)}uiTimers.clear()};
 const listen=(el,type,fn)=>{el?.addEventListener(type,fn);cleanups.push(()=>el?.removeEventListener(type,fn))};
 const phase=value=>stage.dataset.storyPhase=value;
 function loadImage(src){return new Promise(resolve=>{
  const img=new Image();let done=false,timer;
  const finish=ok=>{if(done)return;done=true;img.onload=img.onerror=null;clearTimeout(timer);timers.delete(timer);pendingLoads.delete(cancel);resolve(ok)};
  const cancel=()=>finish(false);pendingLoads.add(cancel);img.onload=()=>{if(img.decode)img.decode().then(()=>finish(true),()=>finish(true));else finish(true)};img.onerror=()=>finish(false);img.src=storyAsset(src);
  if(img.complete){finish(!!img.naturalWidth);return}timer=later(()=>finish(!!img.naturalWidth),4000);
 })}

form.onsubmit=async e=>{e.preventDefault();if(!form.checkValidity())return form.reportValidity();if(pay.dataset.busy==='true')return;pay.dataset.busy='true';pay.disabled=true;const area=document.querySelector('#intake-status'),snapshot=JSON.stringify(intakePayload(p.id,d));area.textContent='입력 정보와 접수 기준을 확인하고 있어요.';try{const result=await requestIntake(p.id,d);if(!area.isConnected||snapshot!==JSON.stringify(intakePayload(p.id,d)))return;area.innerHTML=intakeNotice(result,p.id);if(result.paymentAllowed){bindReadyCheckout(area,p,d);area.querySelector('[data-start-payment]')?.click()}area.scrollIntoView({behavior:'smooth',block:'nearest'});d.intakeDecision={status:result.status,code:result.code,inputFingerprint:result.inputFingerprint||null,policyVersion:result.policyVersion};save();}finally{pay.dataset.busy='false';if(pay.isConnected)update();}};update();bindDiscounts(p,d)}

function legalPage(type){const title={privacy:'개인정보 처리방침',terms:'이용약관',refund:'환불 안내'}[type];if(!title)return notFound();const content=type==='privacy'?`<h2>1. 받는 정보</h2><p>이름, 성별, 생년월일과 양력·음력·윤달 여부, 태어난 시간(정확한 시각, 시간 범위 또는 모름), 태어난 지역, 상품별 질문과 답, 이메일을 받습니다. 두 사람 상품은 상대방의 같은 정보를 받습니다. 카드 정보는 토스페이먼츠가 직접 받고, 김승용은(는) 카드 번호를 받지 않습니다.</p><h2>2. 쓰는 목적</h2><p>사주 결과를 계산하고 작성해 이메일로 보내는 데 씁니다. 그 밖의 광고나 다른 목적으로 쓰지 않습니다.</p><h2>3. 보관 기간</h2><p>출생 정보와 질문은 결과 메일을 보내는 즉시 지웁니다. 결과 PDF는 다시 보내기를 위해 7일 동안 보관한 뒤 지웁니다. 발송이 보류된 주문의 정보는 다시 만들 수 있게 7일 동안 보관한 뒤 지우고, 결제가 안 된 주문의 정보는 8일 안에 지웁니다. 주문번호, 결제 금액, 이메일 같은 거래 기록은 전자상거래법에 따라 5년 동안 보관합니다. 첫 구매 묶음 할인을 확인하려고 이메일을 알아볼 수 없게 바꾼 값(해시)과 구매 여부를 보관하고, 할인 코드 사용 기록도 보관합니다.</p><h2>4. 처리를 맡기는 곳</h2><p>토스페이먼츠(결제), Netlify(미국, 사이트와 주문 저장), GitHub(미국, 결과 작성 작업 실행), Anthropic(미국, 결과 글 작성), Resend(미국, 이메일 발송)에 필요한 정보만 맡깁니다. 해외 업체로는 주문을 처리하는 동안 암호화된 연결로 전송됩니다.</p><h2>5. 요청할 수 있는 것</h2><p>내 정보의 열람, 정정, 삭제, 처리 중지를 요청할 수 있습니다. 문의: benedicto528@naver.com</p>`:type==='terms'?`<h2>1. 서비스</h2><p>운명서재는 입력한 출생 정보로 사주를 계산하고, 개인별 결과를 PDF로 작성해 결제 후 1일 이내에 이메일로 보내드립니다.</p><h2>2. 콘텐츠의 성격</h2><p>사주 결과는 자기 이해와 오락을 위한 참고 자료입니다. 의료, 법률, 투자 같은 중요한 판단을 대신하지 않습니다.</p><h2>3. 입력 정보</h2><p>결과는 입력한 정보로 작성됩니다. 생년월일이나 시간이 틀리면 결과도 달라지므로 정확히 입력해주세요.</p><h2>4. 저작권</h2><p>결과 PDF는 구매한 분의 개인적인 이용을 위해 제공되며, 무단으로 다시 팔거나 배포할 수 없습니다.</p>`:`<h2>서비스 제공 기간</h2><p>결과 PDF는 결제 후 1일 이내에 주문할 때 입력한 이메일로 보내드립니다. 보통 10분 안에 도착합니다. 배송 상품이 아닙니다.</p><h2>결과를 보내기 전</h2><p>결제 후 결과 이메일을 보내기 전에는 전액 환불해 드립니다.</p><h2>결과를 보낸 뒤</h2><p>결과는 결제 후 개인별로 작성하는 디지털 콘텐츠라서, 이메일로 보낸 뒤에는 단순 변심으로 인한 환불이 어렵습니다(전자상거래법 제17조 제2항).</p><h2>오류가 있을 때</h2><p>이메일이 오지 않거나, 입력한 정보와 다른 내용으로 작성되는 등 오류가 있으면 다시 보내드리거나 전액 환불해 드립니다.</p><h2>문의</h2><p>benedicto528@naver.com</p>`;layout(title,`<article class="legal page-pad"><span class="pill">운명서재 이용 안내</span><h1>${title}</h1><p class="muted">시행일: 2026년 10월 12일</p>${content}<a class="secondary" href="#/support">고객센터</a></article>`)}

function tasterItem(a,kind,i){const p=pById(a.product);return `<article class="taster-item ${kind}"><div class="taster-rank"><span>${kind==='good'?'좋은 운':'조심할 운'} ${i+1}위</span><h3>${esc(a.title)}</h3></div><p>${esc(a.text)}</p><p class="taster-hook">${esc(a.hook)}</p><a class="taster-more" href="#/f/${p.id}/intro" data-taster-product="${p.id}">나의 ${esc(p.short)} 자세히 알아보기 →</a></article>`}
function tasterChart(r){const c=r.chart;
 return `<div class="taster-chart">${c.columns.map(x=>`<div class="tc-col${x.me?' me':''}"><small>${x.label}</small><b>${x.hanja?esc(x.hanja[0]):'?'}</b><b>${x.hanja?esc(x.hanja[1]):'?'}</b><span>${x.ko?esc(x.ko):'모름'}</span>${x.me?'<em>나</em>':''}</div>`).join('')}</div><p class="taster-note">${esc(r.name)} 님이 태어난 해·달·날·시를 여덟 글자로 바꾼 것이 사주팔자입니다. ${esc(r.name)} 님은 ${esc(c.zodiac)}띠입니다.${c.columns[0].hanja?'':' 태어난 시간을 몰라서 시 자리는 비워 두었습니다.'}</p>
 <section class="taster-box"><h3>${esc(r.name)} 님 사주 한눈에 보기</h3>${c.items.map(it=>`<div class="tb-item"><strong>${esc(it.head)}</strong><p>${esc(it.text)}</p></div>`).join('')}<div class="tb-bars">${c.elements.map(e=>`<div class="tb-bar ${e.status}"><span>${esc(e.word)}</span><i><b style="width:${Math.min(100,e.pct*2)}%"></b></i><em>${e.pct}%</em></div>`).join('')}</div></section>`}
function tasterPage(){
 document.title='무료 사주 맛보기 · '+BRAND.name;
 const r=tasterState.result;
 if(!r){layout('무료 사주 맛보기',`<div class="flow-content birth-info-page taster-form" data-birth-tone="lifetime"><span class="eyebrow">FREE SAJU</span><h1>내 사주에서<br>좋은 운 3개, 조심할 운 3개</h1><p class="muted">생년월일과 태어난 시간을 넣으면, 연애·결혼·헤어진 인연·돈·직장·사업·건강·2027년, 여덟 가지 운 가운데 가장 좋은 운 3개와 가장 조심할 운 3개를 바로 보여드려요. 무료입니다.</p><form id="taster-form" novalidate>${reuseBox(tasterState.person,'reuse-me')}${personFields('taster',tasterState.person)}<button class="primary taster-submit" id="taster-submit" type="submit" disabled>무료로 내 운 보기</button></form><p class="local-note">입력한 정보는 이 화면에서만 계산하고 서버에 보내지 않아요.</p></div>`);
  const f=document.querySelector('#taster-form'),btn=document.querySelector('#taster-submit');
  bindPerson(f,(v,valid)=>{tasterState.person=v;btn.disabled=!valid});
  bindReuse('reuse-me',v=>{tasterState.person=v});
  f.onsubmit=async e=>{e.preventDefault();const v=readPerson(f);if(!personValid(v)||!f.checkValidity()){f.reportValidity();return}
   btn.disabled=true;btn.textContent='사주를 계산하고 있어요';
   try{const {eng,tst,data,texts}=await tasterLoad();const date=validateBirthDate(v);const fp=eng.chartFromPerson(data,v,v.calendar==='lunar'?date.solarDate:v.birth);rememberMe(v);tasterState={person:v,result:tst.reading(fp,v,texts)};tasterPage();window.scrollTo({top:0,behavior:'instant'})}
   catch(err){console.error(err);btn.disabled=false;btn.textContent='무료로 내 운 보기';toast('계산하지 못했어요. 잠시 뒤 다시 눌러 주세요.')}};
  return}
 layout('무료 사주 맛보기',`<div class="page-pad taster-result"><span class="eyebrow">FREE SAJU</span><h1>${esc(r.name)} 님의<br>좋은 운과 조심할 운</h1>${tasterChart(r)}<h2 class="taster-head good">좋은 운 TOP 3</h2>${r.good.map((a,i)=>tasterItem(a,'good',i)).join('')}<h2 class="taster-head bad">조심할 운 TOP 3</h2>${r.bad.map((a,i)=>tasterItem(a,'bad',i)).join('')}<a class="taster-lifetime" href="#/f/lifetime/intro" data-taster-product="lifetime"><span class="eyebrow">내 사주 전체</span><strong>내 사주 전체를<br>한 권으로 보고 싶다면</strong><span>${esc(pById('lifetime').name)} 자세히 알아보기 →</span></a><div class="taster-all"><p>다른 운도 자세히 보기</p>${['newyear','romance','reunion','intimate','wealth','career','business','health'].map(id=>`<a href="#/f/${id}/intro" data-taster-product="${id}">${esc(pById(id).short)}</a>`).join('')}</div><button type="button" class="taster-redo" id="taster-redo">입력한 정보 고쳐서 다시 보기</button></div>`);
 // 잘못 넣었을 수 있으니, 넣었던 정보를 그대로 채운 입력 화면으로 돌아간다.
 document.querySelector('#taster-redo').onclick=()=>{tasterState.result=null;tasterPage();window.scrollTo({top:0,behavior:'instant'})};
 // '자세히 알아보기'로 간 상품에는 방금 넣은 출생 정보를 미리 채워 둔다.
 document.querySelectorAll('[data-taster-product]').forEach(a=>a.addEventListener('click',()=>{const d=draft(a.dataset.tasterProduct);if(!d.self||!personValid(d.self)){d.self={...tasterState.person};save()}}));
}
// 전에 입력한 내 정보 다시 쓰기 (2026-10-26 사장님 요청). build_site.py 가 사이트 코드 안에 넣는다.
// 본인 정보를 한 번 넣으면 이 브라우저에 기억해 두고, 다른 상품·무료 분석 입력 화면 맨 위에서 체크 한 번으로 채운다.
const ME_KEY='unmyeong.me';
function savedMe(){try{const v=JSON.parse(localStorage.getItem(ME_KEY)||'null');return v&&personValid(v)?v:null}catch{return null}}
function rememberMe(v){try{if(v&&personValid(v))localStorage.setItem(ME_KEY,JSON.stringify(v))}catch{}}
function meKey(v={}){const p=v.birthPlace||{};return JSON.stringify([v.name,v.sex,v.calendar,v.birth,v.leapStatus,v.timeAccuracy,v.time,v.timeRange,p.status,p.regionChoice,p.districtCode,p.city])}
function reuseBox(current,id){const me=savedMe();if(!me)return '';return `<label class="reuse-me"><input type="checkbox" id="${id}" ${meKey(current)===meKey(me)?'checked':''}><span><b>전에 입력한 내 정보 그대로 쓰기</b><small>${esc(me.name)} · ${personBirthSummary(me)}</small></span></label>`}
// 체크를 풀어도 이미 채운 칸은 지우지 않는다(손님 테스트 2차: 눌렀더니 다 지워져 0/4가 됨). 고칠 칸만 고치면 된다.
function bindReuse(id,set){const box=document.getElementById(id);if(box)box.onchange=()=>{if(box.checked){set({...savedMe()});render()}}}
// 시·도 목록: 옛 지역명은 빼고, 누구나 아는 짧은 이름으로 보여 준다.
const REGION_PLAIN={'서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','전남광주통합특별시':'광주·전남','대전광역시':'대전','울산광역시':'울산','세종특별자치시':'세종','경기도':'경기도','강원특별자치도':'강원도','충청북도':'충청북도','충청남도':'충청남도','전북특별자치도':'전라북도','경상북도':'경상북도','경상남도':'경상남도','제주특별자치도':'제주도'};
const REGION_ORDER=Object.keys(REGION_PLAIN);
function plainRegions(){return KOREA_REGIONS.filter(r=>!r.legacy&&REGION_PLAIN[r.name]).sort((a,b)=>REGION_ORDER.indexOf(a.name)-REGION_ORDER.indexOf(b.name))}
// 선물하기(사장님 2026-10-30): 본인 정보 입력 화면 맨 위에서 '내 사주 / 다른 사람 사주(선물)'를 고른다.
// 선물이면 받는 분 정보를 넣고, 문구를 '○○ 님의 정보'로 바꾸며, 이 정보는 '내 정보'로 기억하지 않는다. PDF는 주문한 분 이메일로 간다.
const GIFT_KEY='unmyeong.gift.';
function curPid(){const m=location.hash.match(/#\/f\/([^/]+)/);return m?m[1]:''}
function isGift(pid=curPid()){try{return sessionStorage.getItem(GIFT_KEY+pid)==='1'}catch{return false}}
function setGift(pid,on){try{on?sessionStorage.setItem(GIFT_KEY+pid,'1'):sessionStorage.removeItem(GIFT_KEY+pid)}catch{}}
function giftBox(pid){const g=isGift(pid);return `<div class="gift-pick"><p>누구의 사주인가요?</p><div class="segmented" role="group" aria-label="누구의 사주인가요"><label><input type="radio" name="gift-pick" value="me" ${g?'':'checked'}><span>내 사주</span></label><label><input type="radio" name="gift-pick" value="gift" ${g?'checked':''}><span>다른 사람 사주(선물)</span></label></div>${g?'<small>선물 받을 분의 정보를 넣어 주세요. 결과 PDF는 주문하시는 분 이메일로 보내드려요.</small>':''}</div>`}

// 재회사주: 손님이 화면에서 본 첫 달을 주문에 함께 보내, 리포트가 정확히 같은 24개월을 쓰게 한다(제1조항, 사장님 2026-10-30).
function revealShownStart(p,d,rv){const sm=revealStartMonth(rv);if(p.id==='reunion'){d.answers=d.answers||{};d.answers.revealStart=`${sm[0]}-${String(sm[1]).padStart(2,'0')}`;try{save()}catch{}}return sm}
// 이야기 화면이 보여 준 사주의 열쇠: 내 정보(두 사람 상품은 상대방 정보까지)가 바뀌면 이야기를 처음부터 다시 보여 준다(제1조항).
function revealKey(p,d){return p.id+'|'+JSON.stringify(d.self)+(['intimate','reunion'].includes(p.id)?'|'+JSON.stringify(d.partner||{}):'')}
function revealCompute(p,d,lib){
 const {eng,tst,data,texts,rv}=lib,v=d.self,date=validateBirthDate(v);
 const fp=eng.chartFromPerson(data,v,v.calendar==='lunar'?date.solarDate:v.birth);
 const r=tst.reading(fp,v,texts),R=texts.REVEAL;
 const area=p.id==='lifetime'?null:tst.areaView(fp,v,texts,p.id),parts=p.id==='lifetime'?null:tst.areaParts(fp,v,texts,p.id);
 return {name:r.name,r,R,area,parts,map:rv.luckMap(fp,v.sex,p.id,texts,revealStartYear(),revealShownStart(p,d,rv)),fill:tst.fill,A:texts.AREAS,pair:revealPair(p,d,lib,fp),boundary:rv.boundaryLines(data,v,v.calendar==='lunar'?date.solarDate:v.birth),note:id=>tst.situationNote(id,d.answers,texts)};
}
// 깊은 궁합·재회사주: 그 사람 사주와 함께 본 '두 사람 궁합 점수'(saju/pair.py pair_score 와 같은 계산, 리포트에 같은 점수가 나온다).
function revealPair(p,d,lib,fp){
 if(!['intimate','reunion'].includes(p.id)||!d.partner||!personValid(d.partner))return null;
 const {eng,data,rv}=lib,o=d.partner,od=validateBirthDate(o);
 return {...rv.pairScore(fp,eng.chartFromPerson(data,o,o.calendar==='lunar'?od.solarDate:o.birth)),name:(o.name||'').trim()||'그 사람'};
}
function revealSpeech(p,text){return `<div class="rv-guide"><img src="${esc(MEDIA[p.id+'.cover'].image)}" alt="금월선녀" decoding="async"><div><strong>금월선녀</strong><p>${esc(text)}</p></div></div>`}
function revealLocks(items){return `<div class="rv-locks">${items.map(t=>`<div>${icon('lock')}<span>${esc(t)}</span><i>리포트에서 공개</i></div>`).join('')}</div>`}
// 1. 내 사주 펼치기: 사주팔자 네 기둥, 나를 뜻하는 글자, 타고난 큰 방향, 다섯 기운
// 타고난 큰 방향(격국) 설명은 돈·일과 이어지는 말이라, 돈·일·평생을 보는 상품에서만 보여 준다(손님 테스트: 건강운인데 '월급처럼 들어오는 돈').
function rvScene0(p,v){const c=v.r.chart,me=c.items[0],gy=['lifetime','wealth','career','business'].includes(p.id)?c.items[4]:null;
 return `${revealSpeech(p,`${v.name} 님이 태어난 순간의 여덟 글자를 펼쳤어요. 성격도, 돈도, 사람도 이 여덟 글자에서 읽고, 해마다 바깥에서 들어오는 운이 이 여덟 글자와 어떻게 만나는지도 함께 볼게요.`)}
 <span class="eyebrow">STEP 1 · ${typeof isGift==='function'&&isGift(p.id)?esc(v.name)+' 님':'내'} 사주 펼치기</span><h1>${esc(v.name)} 님의 사주팔자</h1>
 <div class="taster-chart">${c.columns.map(x=>`<div class="tc-col${x.me?' me':''}"><small>${x.label}</small><b>${x.hanja?esc(x.hanja[0]):'?'}</b><b>${x.hanja?esc(x.hanja[1]):'?'}</b><span>${x.ko?esc(x.ko):'모름'}</span>${x.me?'<em>나</em>':''}</div>`).join('')}</div>
 ${v.boundary.length?`<div class="rv-card rv-boundary">${v.boundary.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`:''}
 <div class="rv-card"><strong>${esc(me.head)}</strong><p>${esc(me.text)}</p></div>
 ${gy?`<div class="rv-card"><strong>${esc(gy.head)}</strong><p>${esc(gy.text)}</p></div>`:''}
 <div class="rv-card"><strong>다섯 기운의 비율</strong><div class="tb-bars">${c.elements.map(e=>`<div class="tb-bar ${e.status}"><span>${esc(e.word)}</span><i><b style="width:${Math.min(100,e.pct*2)}%"></b></i><em>${e.pct}%</em></div>`).join('')}</div></div>`}
// 2. "이거 맞죠?": 가장 센 기운, 가장 모자란 기운, 나를 받쳐 주는 힘으로 본 모습 세 가지

function rvScene1(p,v){const items=rvConfirmItems(v),ans=revealState.confirm,done=items.every((_,n)=>ans[n]),yes=items.filter((_,n)=>ans[n]==='yes').length;

 ${items.map((it,n)=>`<div class="rv-card rv-confirm"><small>${esc(it.head)}</small><p>${esc(it.text)}</p><div class="rv-yesno" role="group"><button type="button" data-confirm="${n}" data-v="yes" class="${ans[n]==='yes'?'on':''}">맞아요</button><button type="button" data-confirm="${n}" data-v="no" class="${ans[n]==='no'?'on':''}">아니에요</button></div>${ans[n]==='no'?`<p class="rv-no">그렇게 느끼실 수 있어요. 사주는 타고난 바탕이라, 자라온 환경과 지금까지의 노력에 따라 다르게 드러나기도 해요. 리포트에서 이 부분이 ${esc(v.name)} 님에게 어떻게 드러나는지 더 자세히 풀어 드릴게요.</p>`:''}</div>`).join('')}
 <p class="rv-skip-note">눌러 보지 않아도 아래 버튼으로 다음 이야기로 넘어갈 수 있어요.</p>
 ${done?`<p class="rv-result">${esc(v.fill(yes>=2?v.R.CONFIRM_MANY:v.R.CONFIRM_FEW,{name:v.name,n:String(yes)}))}</p>`:''}`}
// 3. 내 점수: 이 상품의 운 점수와 근거(맛보기와 같은 글) + 다른 운 점수까지 모두 공개
// 막대 색과 이름은 아래 카드·무료 풀이와 같게: 무료 풀이 '좋은 운 TOP3'는 초록, '조심할 운 TOP3'는 빨강, 나머지는 보통(제1조항).
function rvBars(v,skip){const side=id=>v.r.good.some(a=>a.id===id)?'good':v.r.bad.some(a=>a.id===id)?'bad':'mid';return `<div class="rv-bars">${Object.entries(v.r.scores).filter(([id])=>id!==skip).sort((a,b)=>b[1]-a[1]).map(([id,s])=>{const k=side(id);return `<div class="rv-bar ${k}"><span>${esc(v.A[id]?.title||v.R.AREA_WORD[id])}</span><i><b style="width:${s}%"></b></i><em>${s}점</em></div>`}).join('')}</div>`}
function rvScene2(p,v){const s=SALES[p.id];
 if(!v.area){const all=[...v.r.good.map(a=>[a,1]),...v.r.bad.map(a=>[a,-1])];
  return `${revealSpeech(p,`${v.name} 님 사주로 여덟 가지 운의 점수를 모두 계산했어요. 높은 운은 크게 받고, 낮은 운은 미리 대비하면 돼요.`)}
  <span class="eyebrow">STEP 3 · ${typeof isGift==='function'&&isGift(p.id)?esc(v.name)+' 님':'내'} 점수</span><h1>${esc(v.name)} 님의<br>여덟 가지 운 점수</h1>${rvBars(v)}
  ${all.map(([a,sg])=>`<div class="rv-card ${sg>0?'good':'bad'}"><small>${sg>0?'가장 좋은 운':'가장 조심할 운'} · ${esc(a.title)} ${a.score}점</small><p>${esc(a.text)}${v.note(a.id)?' '+esc(v.note(a.id)):''}</p><p class="rv-hook">${esc(v.fill(sg>0?v.R.SCORE_GOOD:v.R.SCORE_BAD,{name:v.name,area:v.R.AREA_WORD[a.id]}))}</p></div>`).slice(0,4).join('')}
  ${revealLocks(s?.locks||[])}`}
 const pt=v.parts,word=v.R.AREA_WORD[p.id];
 const M=v.R.MARKS,month=v.map.unit==='month',when=ls=>ls.map(l=>month?l:l+'년').join(' · '),vals={name:v.name,weak:v.map.weak};
 // 좋은 점·조심할 점 모두 같은 크기의 큰 점수로 보여 준다(사장님 2026-10-28).
 const big=(kind,sc,sub)=>`<div class="rv-score ${kind}"><small class="rv-score-label">${esc(word)}의 ${kind==='good'?'좋은 점':'조심할 점'}</small><strong>${sc}<small>점</small></strong>${sub?`<span>${esc(sub)}</span>`:''}<i><b style="width:${sc}%"></b></i></div>`;
 // 근거가 한쪽에만 있으면 다른 쪽은 지도에서 그 쪽 해(달)를 꺼내 짚는다.
 // 점수: 앞으로 12년(12달) 가운데 그런 해(달)가 몇 번인지로 매긴다(saju/reveal.py side_score 와 같은 식).
 const N=v.map.cells.length,spanW=N===24?'24개월':month?'열두 달':'12년';
 const sideScore=(d,kind)=>{const n=new Set(Object.values(d).flat()).size;return kind==='good'?Math.min(95,50+Math.round(50*n/N)):Math.max(5,50-Math.round(50*n/N))};
 const yearsPart=(d,kind)=>{const n=new Set(Object.values(d).flat()).size,sc=sideScore(d,kind);
  // 'N번'이라고 했으면 N개를 모두 적는다(표시마다 한 줄). 뜻 풀이는 첫 표시 하나만.
  const ents=Object.entries(d);if(!ents.length)return '';const [k0]=ents[0];
  return big(kind,sc,`앞으로 ${spanW} 중 ${kind==='good'?'운이 들어오는':'조심할'} ${month?'달':'해'} ${n}번`)+`<div class="rv-card ${kind}">${ents.map(([key,ls])=>`<p>${esc(when(ls))}은 ${esc(v.fill(M[key].line,vals))}입니다.</p>`).join('')}<p>${esc(v.fill(M[k0].meaning,vals))}</p><p class="rv-hook">${esc(M[k0].hook)}</p></div>`};
 const reasonPart=(x,kind)=>big(kind,x.score,kind==='good'?(x.score>=60?'좋은 운':'좋은 편인 운'):'조심할 운')+`<div class="rv-card ${kind}"><p>${esc(x.text)}</p><p class="rv-hook">${esc(v.fill(kind==='good'?v.R.SCORE_GOOD:v.R.SCORE_BAD,{name:v.name,area:word}))}</p></div>`;
 const goodPart=pt.good?reasonPart(pt.good,'good'):yearsPart(v.map.good,'good');
 const badPart=pt.bad?reasonPart(pt.bad,'bad'):yearsPart(v.map.bad,'bad');
 // 점수가 높은 쪽이 위, 낮은 쪽이 아래(사장님 2026-10-28). 같으면 전체 점수로 정한다.
 const gs=pt.good?pt.good.score:sideScore(v.map.good,'good'),bs=pt.bad?pt.bad.score:sideScore(v.map.bad,'bad');
 const good=gs!==bs?gs>bs:pt.score>=50;
 // 제목·말풍선은 무료 풀이에서 이 운을 좋은 운/조심할 운 어느 쪽으로 보여 줬는지(areaView sign)를 따른다(제1조항: 모순 금지).
 const tone=v.area.sign>0,unitW=month?'달':'해';
 const speech=tone?(pt.good?`${word}부터 볼게요. ${pt.good.score>=60&&pt.score>=50?'좋은 점 점수가 높은 편이에요':'좋은 점이 분명히 있는 운이에요'}. 때를 알고 움직이면 더 크게 받을 수 있어요.`:`${word}부터 볼게요. 좋은 운이 들어오는 ${unitW==="달"?"달이":"해가"} 정해져 있어요. 그때를 알면 놓치지 않고 받을 수 있어요.`)
  :(good?(badPart?`${word}부터 볼게요. 좋은 점과 조심할 점이 함께 있어요.`:`${word}부터 볼게요. 조심 표시가 붙은 ${unitW==="달"?"달은":"해는"} 없지만, 미리 챙기면 더 편안해요.`):`${word}부터 볼게요. 조심할 점이 있는 운이에요. 언제 조심하면 되는지 알면 충분히 넘길 수 있어요.`);

  const palace={조화:'두 사람의 배우자 자리(태어난 날의 지지)가 서로 손을 잡는 사이입니다. 함께 있을수록 마음이 편해집니다.',긴장:'두 사람의 배우자 자리(태어난 날의 지지)가 서로 부딪히는 사이입니다. 가까워질수록 작은 일로 다투기 쉬워, 다투는 때와 푸는 법을 알아 두면 좋습니다.',복합:'두 사람의 배우자 자리(태어난 날의 지지)에 손잡는 면과 부딪히는 면이 함께 있습니다.',중립:'두 사람의 배우자 자리(태어난 날의 지지)는 크게 끌리지도 부딪히지도 않는 담담한 사이입니다.'}[q.palace];
  const fill=[...q.fill.map(e=>`${q.name} 님은 ${v.name} 님에게 모자란 ${ew(e)} 기운을 채워 줍니다.`),...q.give.map(e=>`${v.name} 님은 ${q.name} 님에게 모자란 ${ew(e)} 기운을 채워 줍니다.`)].join(' ');
  return big(q.score>=60?'good':'bad',q.score,`${v.name} 님과 ${q.name} 님 사주를 함께 본 점수`).replace(`${esc(word)}의 ${q.score>=60?'좋은 점':'조심할 점'}`,'두 사람 궁합 점수')+`<div class="rv-card ${q.score>=60?'good':'bad'}"><p>${esc(palace)}${fill?' '+esc(fill):''}</p><p class="rv-hook">두 사람이 언제 가까워지고 언제 부딪히는지는 리포트에 달 이름까지 담았습니다.</p></div>`})():'';
 const head=tone?(pt.good?'좋은 운을 타고났습니다':`들어오는 ${unitW==="달"?"달이":"해가"} 있습니다`):'미리 알면 대비할 수 있습니다';
 return `${revealSpeech(p,speech)}
 <span class="eyebrow">STEP 3 · ${typeof isGift==='function'&&isGift(p.id)?esc(v.name)+' 님':'내'} 점수</span><h1>${esc(v.name)} 님의 ${esc(word)},<br>${head}</h1>

 ${revealLocks(s?.locks||[])}`}

function rvScene3(p,v){const m=v.map,M=v.R.MARKS,month=m.unit==='month',unit=month?'달':'해',re=p.id==='reunion';
