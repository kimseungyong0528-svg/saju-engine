<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>운명서재 스튜디오</title>
<link rel="icon" type="image/svg+xml" href="/studio/icon.svg">
<link rel="apple-touch-icon" href="/studio/apple-touch-icon.png">
<link rel="manifest" href="/studio/manifest.webmanifest">
<meta name="theme-color" content="#151115">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap" rel="stylesheet">
<style>
@font-face { font-family: Pretendard; src: url(/assets/fonts/PretendardVariable.woff2) format('woff2'); font-weight: 100 900; font-display: swap; }
:root {
  --paper: #f3ecdc; --paper2: #ebe2cc; --card: #fbf7ee; --ink: #000; --ink2: #000; --line: #d9cdb1;
  --red: #9e2f22; --red2: #c0473a; --gold: #b8954a;
  --yt: #d93025; --ig: #c13584; --fb: #1877f2; --th: #1f1b16; --dg: #ff6f0f; --ok: #3d7a4a;
  --r: 14px; --shadow: 0 1px 0 rgba(58,46,34,.06), 0 8px 24px -12px rgba(58,46,34,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: Pretendard, "Gowun Batang", sans-serif; font-weight: 700; font-size: 17px; line-height: 1.6;
  background-image: radial-gradient(rgba(120,95,60,.06) 1px, transparent 1px); background-size: 4px 4px; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
.han { font-family: "Song Myung", serif; }
.seal { display: inline-grid; place-items: center; width: 40px; height: 40px; background: var(--red); color: #f6e6c8;
  font-family: "Song Myung", serif; font-size: 13px; line-height: 15px; text-align: center; border-radius: 3px; flex: none; }
.hidden { display: none !important; }

/* 로그인 */
#login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 36px 28px 28px; box-shadow: var(--shadow); text-align: center; position: relative; }
.login-card::before { content: ""; position: absolute; inset: 8px; border: 1px solid var(--line); border-radius: 12px; pointer-events: none; }
.login-card .seal { width: 64px; height: 64px; font-size: 20px; line-height: 23px; margin-bottom: 16px; }
.login-card h1 { font-family: "Song Myung", serif; font-weight: 400; font-size: 28px; margin: 0 0 4px; }
.login-card p { color: var(--ink2); margin: 0 0 22px; font-size: 15px; }
.field { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 16px; }
.field:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 11px 16px;
  background: var(--red); color: #fff7ea; cursor: pointer; font-weight: 700; text-decoration: none; transition: transform .08s, background .15s; }
.btn:hover { background: var(--red2); } .btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); font-weight: 700; }
.btn.ghost:hover { background: var(--paper2); }
.btn.small { padding: 7px 11px; font-size: 14px; border-radius: 8px; }
.btn.block { width: 100%; margin-top: 12px; }
.err { color: var(--red); min-height: 22px; font-size: 14px; margin-top: 10px; }

/* 머리 */
header { position: sticky; top: 0; z-index: 5; background: rgba(243,236,220,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1120px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand b { font-family: "Song Myung", serif; font-weight: 400; font-size: 21px; }
.brand small { display: block; color: var(--ink2); font-size: 12px; line-height: 1; }
select.field { width: auto; padding: 8px 10px; font-size: 14px; }
nav { max-width: 1120px; margin: 0 auto; padding: 0 12px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav button { border: 0; background: none; padding: 10px 12px 12px; cursor: pointer; color: var(--ink2); white-space: nowrap; border-bottom: 3px solid transparent; }
nav button.on { color: var(--ink); border-bottom-color: var(--red); font-weight: 700; }
main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 80px; }
h2.sec { font-family: "Song Myung", serif; font-weight: 400; font-size: 24px; margin: 6px 0 14px; display: flex; align-items: center; gap: 10px; }
h2.sec::before { content: ""; width: 6px; height: 22px; background: var(--red); border-radius: 2px; }
.muted { color: var(--ink2); font-size: 14px; }
.empty { background: var(--card); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px 20px; text-align: center; color: var(--ink2); }

/* 날짜 칩 */
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; }
.day { flex: none; min-width: 66px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 10px; text-align: center; cursor: pointer; }
.day b { display: block; font-size: 18px; } .day span { font-size: 12px; color: var(--ink2); }
.day.on { background: var(--ink); color: #f6ecd6; border-color: var(--ink); } .day.on span { color: #fff; }
.day .dots { display: flex; gap: 3px; justify-content: center; margin-top: 4px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); } .day .dots i.ok { background: var(--ok); }
.progress { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.progress .track { flex: 1; height: 8px; background: var(--paper2); border-radius: 99px; overflow: hidden; }
.progress .fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--red)); border-radius: 99px; transition: width .3s; }

/* 게시물 카드 */
.slot { font-family: "Song Myung", serif; font-size: 18px; margin: 22px 0 10px; color: var(--ink2); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.post { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; position: relative; }
.post::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.post.done { opacity: .62; }
.post-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px 18px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; color: #fff; background: var(--c); }
.time { font-size: 13px; color: var(--ink2); }
.hot { margin-left: auto; font-size: 12px; color: var(--red); border: 1px solid #e6c2b9; background: #fbeee9; padding: 2px 8px; border-radius: 99px; }
.post h3 { margin: 0; padding: 0 14px 10px 18px; font-size: 16.5px; line-height: 1.45; word-break: keep-all; }
.media { background: #1d1813; display: flex; justify-content: center; }
.media video { width: 100%; max-height: 420px; background: #1d1813; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--line); }
.thumbs img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; cursor: zoom-in; }
.texts { padding: 10px 14px 4px 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
details.tx { min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
details.tx summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; font-size: 14px; }
details.tx summary::-webkit-details-marker { display: none; }
details.tx summary .lab { font-weight: 700; }
details.tx summary .pre { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
details.tx pre { margin: 0; padding: 4px 12px 12px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; font-family: inherit; font-size: 14.5px; line-height: 1.65; border-top: 1px dashed var(--line); max-height: 360px; overflow: auto; }
.copy { flex: none; border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 3px 9px; font-size: 13px; cursor: pointer; }
.copy.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
#rules { margin: 12px 14px 0; background: var(--paper); border: 2px solid #a8262b; border-radius: 12px; padding: 10px 14px; font-size: 14px; color: var(--ink2); }
#rules summary { font-weight: 700; color: #a8262b; cursor: pointer; }
#rules h4 { margin: 10px 0 4px; font-size: 15px; color: inherit; }
#rules ul { margin: 4px 0 6px; padding-left: 18px; }
#rules li { margin: 2px 0; }
#rules a { color: #a8262b; text-decoration: underline; }
.tip { margin: 0 14px 0 18px; font-size: 13px; color: var(--ink2); background: var(--paper); border-radius: 8px; padding: 7px 10px; }
.post-foot { margin-top: auto; display: flex; gap: 8px; padding: 12px 14px 14px 18px; flex-wrap: wrap; }
.toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px 6px 8px; background: #fff; font-size: 14px; }
.toggle i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 12px; color: transparent; }
.toggle.on { background: var(--ok); border-color: var(--ok); color: #fff; } .toggle.on i { border-color: #fff; color: #fff; }
.toggle.appr.on { background: var(--red); border-color: var(--red); }
.result { font-size: 13px; padding: 6px 10px; border-radius: 8px; width: 100%; word-break: break-all; }
.result.ok { background: #e7f2e9; color: var(--ok); } .result.bad { background: #fbeee9; color: var(--red); }
.result a { color: inherit; }
.approve-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px; }
.approve-bar b { margin-right: auto; }

/* 주간표 */
.table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 14px; }
.table th, .table td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--line); }
.table th { background: var(--paper2); font-weight: 700; }
.table tr:last-child td { border-bottom: 0; }
.table td.lab { text-align: left; white-space: nowrap; }
.cell { display: inline-block; width: 26px; height: 26px; border-radius: 7px; background: var(--paper2); border: 1px solid var(--line); cursor: pointer; vertical-align: middle; }
.cell.ok { background: var(--ok); border-color: var(--ok); }
.scroll { overflow-x: auto; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
.box pre { white-space: pre-wrap; font-family: inherit; margin: 10px 0 0; line-height: 1.7; }

/* 뜬 주제 */
.trend { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.trend:last-child { border-bottom: 0; }
.ratio { font-weight: 700; color: var(--red); font-size: 15px; min-width: 64px; text-align: right; }
.src { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--paper2); white-space: nowrap; }
.trend a { color: var(--ink); text-decoration: none; } .trend a:hover { text-decoration: underline; }
.trend small { display: block; color: var(--ink2); }
.notes li { margin: 2px 0; }

/* 만들기 */
.make { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.make label { display: grid; gap: 4px; font-size: 14px; color: var(--ink2); }
.status { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; color: #fff; }
.st-ready { background: var(--ok); } .st-requested, .st-running { background: var(--gold); } .st-failed { background: var(--red); }
.weekrow { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
.weekrow:last-child { border-bottom: 0; }
.ok-box { border-left: 5px solid var(--ok); } .bad-box { border-left: 5px solid var(--red); }
.problems li { margin: 6px 0; }

/* 확대 보기 */
#zoom { position: fixed; inset: 0; background: rgba(20,14,10,.88); display: grid; place-items: center; z-index: 20; padding: 16px; }
#zoom img { max-width: 100%; max-height: 92vh; border-radius: 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #f6ecd6; padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 30; }
@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr; }
  .brand small { display: none; }
  h2.sec { font-size: 21px; }
}
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <div class="seal">運命<br>書齋</div>
    <h1>운명서재 스튜디오</h1>
    <p>사장님 전용 SNS 게시물 관리</p>
    <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <button class="btn block" type="submit">들어가기</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <div class="bar">
      <div class="brand"><span class="seal">운명<br>서재</span><div><b>스튜디오</b><small>SNS 게시물 관리</small></div></div>
      <select class="field" id="weekSel" aria-label="주 고르기"></select>
      <button class="btn ghost small" id="logout">나가기</button>
    </div>
    <nav id="tabs">
      <button data-tab="today" class="on">오늘 올릴 것</button>
      <button data-tab="week">이번 주</button>
      <button data-tab="trends">뜬 주제</button>
      <button data-tab="make">만들기</button>
      <button data-tab="check">검사</button>
    </nav>
  </header>
  <details id="rules" open><summary>게시 규칙 (못 박음)</summary><div id="rulesBody">불러오는 중…</div></details>
  <main id="view"></main>
</section>

<div id="zoom" class="hidden"></div>

<script>
const CH = {
  'youtube': { name: '유튜브 쇼츠', color: 'var(--yt)', icon: '▶' },
  'instagram-reel': { name: '인스타 릴스', color: 'var(--ig)', icon: '◎', auto: true },
  'facebook-reel': { name: '페이스북 릴스', color: 'var(--fb)', icon: 'f', auto: true },
  'instagram-cards': { name: '인스타 카드뉴스', color: 'var(--ig)', icon: '▦', auto: true },
  'threads': { name: '스레드', color: 'var(--th)', icon: '@', auto: true, tip: '1/2가 먼저 올라가고, 나머지는 그 글에 답글로 이어서 올라가요.' },
};
fetch('/studio/rules.json').then(r => r.json()).then(R => {
  const b = document.getElementById('rulesBody'); b.textContent = '';
  for (const s of R.slots) {
    b.append(el('h4', {}, `${s.slot} ${s.time} · ${s.what}`));
    b.append(el('ul', {}, s.formats.map(f => el('li', {}, `${f.name} (${f.ref})`))));
    b.append(el('p', { class: 'tip' }, s.rotate));
  }
  b.append(el('h4', {}, '늘 지킬 것'));
  b.append(el('ul', {}, R.always.map(t => el('li', {}, t))));
  for (const g of R.refs || []) {
    b.append(el('h4', {}, `참고 계정 · ${g.group}`));
    b.append(el('ul', {}, g.items.map(it => el('li', {},
      el('a', { href: it.url, target: '_blank', rel: 'noopener' }, it.name), ` · ${it.stat} · ${it.why}`))));
  }
  const W = R.evening_writing;
  if (W) {
    b.append(el('h4', {}, '저녁 스레드 글 쓰는 법 (잘 터진 계정 분석)'));
    for (const [k, lab] of [['first_line', '첫 줄'], ['structure', '구조'], ['topics', '소재'], ['reply_chain', '댓글로 이어 쓰기'], ['endings', '끝맺음'], ['tone', '말투'], ['never', '안 쓰는 것']])
      b.append(el('ul', {}, el('li', {}, el('b', {}, lab + ': '), W[k].join(' · '))));
  }
}).catch(() => { document.getElementById('rulesBody').textContent = '규칙 파일을 못 읽었어요: /studio/rules.json'; });
const AUTO_TIP = '승인하면 정해진 시각에 자동으로 올라가요. 토스 정식 결제 전에는 사이트 주소 줄은 빼고 올라가요.';
const isDone = it => CH[it.channel]?.auto ? Boolean(S.data.posted?.[it.id]?.ok) : Boolean(S.data.done[it.id]);
const S = { weeks: [], week: null, data: null, tab: 'today', day: null };
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const api = async (path, opts = {}) => {
  const r = await fetch('/api/studio/' + path, { credentials: 'same-origin', headers: opts.body ? { 'Content-Type': 'application/json' } : {}, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401 && path !== 'login') { show('login'); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.code || r.status), { code: j.code, status: r.status });
  return j;
};
const fileUrl = (path, dl) => `/api/studio/file/${S.week}?path=${encodeURIComponent(path)}${dl ? '&dl=1' : ''}`;
const toast = msg => { const t = el('div', { class: 'toast' }, msg); document.body.append(t); setTimeout(() => t.remove(), 1600); };
const fmtDate = iso => { const d = new Date(iso + 'T00:00:00'); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
const todayIso = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

function show(which) {
  $('#login').classList.toggle('hidden', which !== 'login');
  $('#app').classList.toggle('hidden', which !== 'app');
  if (which === 'login') setTimeout(() => $('#pw').focus(), 50);
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  try { await api('login', { method: 'POST', body: { password: $('#pw').value } }); $('#pw').value = ''; await boot(); }
  catch (err) {
    $('#loginErr').textContent = { WRONG_PASSWORD: '비밀번호가 맞지 않아요.', TOO_MANY: '여러 번 틀려서 한 시간 동안 막혔어요.', NOT_CONFIGURED: '넷리파이에 STUDIO_PASSWORD 가 아직 없어요.' }[err.code] || '들어가지 못했어요. 잠시 뒤 다시 해 주세요.';
  }
});
$('#logout').addEventListener('click', async () => { await api('logout', { method: 'POST' }).catch(() => {}); show('login'); });
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab; render(); });
$('#weekSel').addEventListener('change', async e => { await loadWeek(e.target.value); });
$('#zoom').addEventListener('click', () => $('#zoom').classList.add('hidden'));

async function boot() {
  const me = await fetch('/api/studio/me').then(r => r.json()).catch(() => ({}));
  if (!me.loggedIn) return show('login');
  show('app');
  await loadWeeks();
}
async function loadWeeks(keep) {
  S.weeks = (await api('weeks')).weeks;
  const sel = $('#weekSel');
  sel.replaceChildren(...(S.weeks.length ? S.weeks.map(w => el('option', { value: w.week }, `${fmtDate(w.week)} ${(w.posts || 0) > 16 ? '주' : '하루치'}`)) : [el('option', { value: '' }, '아직 없음')]));
  const ready = S.weeks.filter(w => w.status === 'ready');
  const cur = keep && S.weeks.find(w => w.week === keep) ? keep
    : (ready.find(w => w.week <= todayIso()) || ready[ready.length - 1] || S.weeks[0] || {}).week;
  if (cur) { sel.value = cur; await loadWeek(cur); } else { S.week = null; S.data = null; if (S.tab === 'today') S.tab = 'make'; render(); }
}
async function loadWeek(week) {
  S.week = week;
  S.data = await api('weeks/' + week);
  const days = S.data.manifest?.days || [];
  S.day = (days.find(d => d.date === todayIso()) || days[0] || {}).date;
  render();
}

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const v = $('#view');
  v.replaceChildren(({ today: viewToday, week: viewWeek, trends: viewTrends, make: viewMake, check: viewCheck })[S.tab]());
  window.scrollTo({ top: 0 });
}
const needWeek = () => el('div', { class: 'empty' }, S.week && S.data?.week?.status !== 'ready'

function copyBtn(text) {
  return el('button', { class: 'copy', type: 'button', onclick: async e => {
    e.preventDefault(); e.stopPropagation();
    try { await navigator.clipboard.writeText(text); } catch { const t = el('textarea', {}, text); document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
    e.target.classList.add('ok'); e.target.textContent = '복사됨'; setTimeout(() => { e.target.classList.remove('ok'); e.target.textContent = '복사'; }, 1400);
  } }, '복사');
}
function textBlock(label, text, open) {

    el('summary', {}, el('span', { class: 'lab' }, label), el('span', { class: 'pre' }, text.split('\n')[0]), copyBtn(text)),
    el('pre', {}, text));
}
async function setApproved(ids, on) {

async function setDone(id, on) {

function postCard(it) {

function viewToday() {
  const m = S.data?.manifest;
  if (!m) return el('div', {}, el('h2', { class: 'sec' }, '오늘 올릴 것'), needWeek());
  const days = m.days;
  const day = days.find(d => d.date === S.day) || days[0];
  const all = day.items, doneN = all.filter(isDone).length;
  const autoIds = all.filter(i => CH[i.channel]?.auto && !S.data.posted?.[i.id]?.ok).map(i => i.id);
  const apprN = autoIds.filter(id => S.data.approved?.[id]).length;
  const chips = el('div', { class: 'days' }, days.map(d => el('button', { class: 'day' + (d.date === day.date ? ' on' : ''), type: 'button', onclick: () => { S.day = d.date; render(); } },
    el('span', {}, d.weekday + (d.date === todayIso() ? ' · 오늘' : '')), el('b', {}, new Date(d.date + 'T00:00:00').getDate()),
    el('div', { class: 'dots' }, d.items.map(i => el('i', { class: isDone(i) ? 'ok' : '' }))))));
  const slots = ['오전', '점심', '오후', '저녁', '밤', '늦은밤'].map(slot => {
    const items = all.filter(i => i.slot === slot);
    return items.length ? [el('div', { class: 'slot' }, `${slot} ${(items.find(i => i.channel === 'threads') || items[0]).time}`), el('div', { class: 'grid' }, items.map(postCard))] : [];
  });
  return el('div', {},
    el('h2', { class: 'sec' }, `${fmtDate(day.date)} (${day.weekday}) 올릴 것`),
    chips,
    autoIds.length ? el('div', { class: 'approve-bar' },
      el('b', {}, `자동 게시 승인 ${apprN} / ${autoIds.length}`),
      el('button', { class: 'btn small', type: 'button', onclick: () => setApproved(autoIds, true) }, '이날 전부 승인'),
      apprN ? el('button', { class: 'btn ghost small', type: 'button', onclick: () => setApproved(autoIds, false) }, '승인 모두 취소') : null) : null,
    el('div', { class: 'progress' }, el('div', { class: 'track' }, el('div', { class: 'fill', style: `width:${Math.round(doneN / all.length * 100)}%` })), el('span', { class: 'muted' }, `${doneN} / ${all.length} 올림`)),

}

function viewWeek() {
  const m = S.data?.manifest;
  if (!m) return el('div', {}, el('h2', { class: 'sec' }, '이번 주'), needWeek());
  const chans = Object.keys(CH);

  const rows = m.days.map(d => el('tr', {},

  const total = m.days.reduce((n, d) => n + d.items.length, 0), doneN = m.days.reduce((n, d) => n + d.items.filter(isDone).length, 0);

    el('div', { class: 'scroll' }, el('table', { class: 'table' }, el('thead', {}, head), el('tbody', {}, rows))),

function viewTrends() {
  const m = S.data?.manifest;
  if (!m) return el('div', {}, el('h2', { class: 'sec' }, '뜬 주제'), needWeek());

function tomorrow() { const d = new Date(); d.setDate(d.getDate() + 1); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function nextMonday() { const d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

    catch (e) { dayMsg.textContent = { ALREADY_RUNNING: '그날은 지금 만드는 중이에요.', BAD_WEEK: '날짜를 골라 주세요.' }[e.code] || '시작하지 못했어요. 잠시 뒤 다시 눌러 주세요.'; }

      el('p', { class: 'muted' }, '매일 오후 2시에 다음 날 게시물을 저절로 만들어요. 마음에 안 들면 이 버튼으로 다시 만들어요. 다시 만들면 그날 승인은 지워져요.')),
    el('h2', { class: 'sec' }, '일주일치 만들기'),
    el('div', { class: 'box' },

      msg,
      el('p', { class: 'muted' }, '레퍼런스 계정에서 이번 주 뜬 주제를 먼저 모으고, 겹치는 재료부터 하루 6개(유튜브 2, 인스타 릴스 1, 인스타 카드 1, 스레드 2)씩 만들어요. API 비용은 들지 않아요.')),

    el('div', { class: 'box' }, S.weeks.length ? S.weeks.map(w => el('div', { class: 'weekrow' },
      el('b', {}, `${fmtDate(w.week)} ${(w.posts || 0) > 16 ? '주' : '하루치'}`), el('span', { class: 'status st-' + w.status }, label[w.status] || w.status),

      : el('div', { class: 'muted' }, '아직 만든 주가 없어요.')));
}
