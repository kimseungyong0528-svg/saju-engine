<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>운명서재 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #f5f3ef; --card: #ffffff; --soft: #f0ede7; --ink: #17140f; --ink2: #6b6358; --ink3: #9a9184; --line: #e7e2d9; --line2: #d9d2c5;
  --night: #15120e; --night2: #221d17; --gold: #c9a45c; --gold2: #e3c98f;
  --red: #a8262b; --red2: #c23a3f;
  --yt: #e5322d; --ig: #c23a8a; --th: #17140f; --dg: #ff7a1a; --ok: #2f8a57;
  --r: 16px; --shadow: 0 1px 2px rgba(23,20,15,.04), 0 6px 20px -8px rgba(23,20,15,.12);
  --sans: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; min-height: 100vh;
  -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
.han { font-family: "Song Myung", serif; }
.seal { display: inline-grid; place-items: center; width: 36px; height: 36px; background: var(--red); color: #f8e7c9;
  font-family: "Song Myung", serif; font-size: 12px; line-height: 13px; text-align: center; border-radius: 8px; flex: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); letter-spacing: 0; }
.hidden { display: none !important; }

/* 로그인 */
#login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(1200px 600px at 50% -10%, #3a2c1c 0%, var(--night) 55%) fixed; }
.login-card { width: 100%; max-width: 380px; background: rgba(255,255,255,.04); border: 1px solid rgba(227,201,143,.18);
  border-radius: 24px; padding: 40px 30px 30px; text-align: center; color: #f3ead8; backdrop-filter: blur(10px);
  box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); }
.login-card .seal { width: 60px; height: 60px; font-size: 18px; line-height: 20px; margin-bottom: 18px; border-radius: 14px; }
.login-card h1 { font-family: "Song Myung", serif; font-weight: 400; font-size: 30px; margin: 0 0 6px; letter-spacing: 0; }
.login-card p { color: #b9ab92; margin: 0 0 26px; font-size: 14px; }
.login-card .field { background: rgba(255,255,255,.06); border-color: rgba(227,201,143,.22); color: #fff; }
.login-card .field::placeholder { color: #8f826c; }
.login-card .btn { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #2a1f10; }
.login-card .err { color: #f29b8f; }
.field { width: 100%; padding: 12px 14px; border: 1px solid var(--line2); border-radius: 12px; background: #fff; font-size: 15px; transition: border-color .15s, box-shadow .15s; }
.field:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(201,164,92,.18); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 11px 18px;
  background: var(--ink); color: #fff; cursor: pointer; font-weight: 600; text-decoration: none; transition: transform .08s, background .15s, box-shadow .15s; }
.btn:hover { background: #2c2720; box-shadow: 0 6px 16px -8px rgba(23,20,15,.5); } .btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line2); font-weight: 500; }
.btn.ghost:hover { background: var(--soft); box-shadow: none; }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; margin-top: 12px; padding: 13px; }
.err { color: var(--red); min-height: 22px; font-size: 13px; margin-top: 10px; }

/* 머리 */
header { position: sticky; top: 0; z-index: 5; background: var(--night); color: #f3ead8; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.bar { max-width: 1160px; margin: 0 auto; padding: 14px 20px 10px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand b { font-family: "Song Myung", serif; font-weight: 400; font-size: 21px; letter-spacing: 0; }
.brand small { display: block; color: #a8997f; font-size: 12px; line-height: 1.2; }
header select.field { width: auto; padding: 8px 32px 8px 12px; font-size: 13px; background: var(--night2); color: #f3ead8; border-color: #3a3228;
  appearance: none; background-image: linear-gradient(45deg, transparent 50%, #c9b896 50%), linear-gradient(135deg, #c9b896 50%, transparent 50%);
  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
header .btn.ghost { background: transparent; color: #d8cbb2; border-color: #3a3228; }
header .btn.ghost:hover { background: var(--night2); }
nav { max-width: 1160px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav button { border: 0; background: none; padding: 10px 14px 13px; cursor: pointer; color: #9d8f77; white-space: nowrap; font-weight: 500; font-size: 14px;
  position: relative; transition: color .15s; }
nav button:hover { color: #e8dcc4; }
nav button.on { color: #fff; font-weight: 600; }
nav button.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--gold); }
main { max-width: 1160px; margin: 0 auto; padding: 28px 20px 96px; }
h2.sec { font-weight: 700; font-size: 22px; letter-spacing: -0.02em; margin: 4px 0 16px; display: flex; align-items: center; gap: 10px; }
h2.sec::before { content: ""; width: 8px; height: 8px; background: var(--red); border-radius: 2px; transform: rotate(45deg); }
.muted { color: var(--ink2); font-size: 13.5px; }
.empty { background: var(--card); border: 1px dashed var(--line2); border-radius: var(--r); padding: 40px 20px; text-align: center; color: var(--ink2); }

/* 날짜 칩 */
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 14px; scrollbar-width: none; }
.day { flex: none; min-width: 70px; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 9px 10px 8px; text-align: center; cursor: pointer;
  transition: border-color .15s, transform .1s; }
.day:hover { border-color: var(--line2); transform: translateY(-1px); }
.day b { display: block; font-size: 20px; font-weight: 700; line-height: 1.3; } .day span { font-size: 12px; color: var(--ink3); }
.day.on { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: 0 8px 20px -10px rgba(23,20,15,.6); } .day.on span { color: var(--gold2); }
.day .dots { display: flex; gap: 3px; justify-content: center; margin-top: 5px; }
.day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line2); } .day .dots i.ok { background: var(--ok); }
.day.on .dots i { background: #4a4238; } .day.on .dots i.ok { background: #5fd08e; }
.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.progress .track { flex: 1; height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.progress .fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--red)); border-radius: 99px; transition: width .3s; }
.progress .muted { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

/* 게시물 카드 */
.slot { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--ink3); margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
.slot::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.post { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
  transition: box-shadow .2s, transform .2s; }
.post:hover { box-shadow: 0 1px 2px rgba(23,20,15,.04), 0 14px 32px -12px rgba(23,20,15,.2); }
.post.done { opacity: .55; }
.post-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px 4px 8px; border-radius: 99px;
  color: var(--c); background: color-mix(in srgb, var(--c) 10%, white); }

.time { font-size: 12.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.hot { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--red); background: #fbecea; padding: 3px 9px; border-radius: 99px; }
.post h3 { margin: 0; padding: 0 16px 12px; font-size: 16px; font-weight: 700; line-height: 1.45; letter-spacing: -0.02em; word-break: keep-all; }
.media { background: #0f0d0a; display: flex; justify-content: center; }
.media video { width: 100%; max-height: 440px; background: #0f0d0a; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--line); }
.thumbs img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; cursor: zoom-in; transition: opacity .15s; }
.thumbs img:hover { opacity: .85; }
.texts { padding: 12px 16px 4px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
details.tx { min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: #fcfbf9; transition: border-color .15s; }
details.tx[open] { border-color: var(--line2); background: #fff; }
details.tx summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 12px; cursor: pointer; font-size: 13.5px; }
details.tx summary::-webkit-details-marker { display: none; }
details.tx summary .lab { font-weight: 600; white-space: nowrap; }
details.tx summary .pre { color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
details.tx pre { margin: 0; padding: 10px 12px 12px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; font-family: inherit; font-size: 14px; line-height: 1.7; border-top: 1px solid var(--line); max-height: 360px; overflow: auto; }
.copy { flex: none; border: 1px solid var(--line2); background: #fff; border-radius: 8px; padding: 3px 10px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; }
.copy:hover { background: var(--soft); }
.copy.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.tip { margin: 4px 16px 0; font-size: 12.5px; color: var(--ink2); background: var(--soft); border-radius: 10px; padding: 8px 12px; }
.post-foot { margin-top: auto; display: flex; gap: 8px; padding: 14px 16px 16px; flex-wrap: wrap; align-items: center; }
.toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: 1px solid var(--line2); border-radius: 99px; padding: 6px 14px 6px 7px; background: #fff; font-size: 13px; font-weight: 500; transition: all .15s; }
.toggle:hover { border-color: var(--ok); }
.toggle i { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line2); display: grid; place-items: center; font-style: normal; font-size: 11px; color: transparent; }
.toggle.on { background: var(--ok); border-color: var(--ok); color: #fff; } .toggle.on i { border-color: #fff; color: #fff; }

/* 주간표 */
.table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 13.5px; }
.table th, .table td { padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--line); }
.table th { background: #faf8f4; font-weight: 600; color: var(--ink2); font-size: 12.5px; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: #fcfbf8; }
.table td.lab { text-align: left; white-space: nowrap; font-weight: 600; }
.cell { display: inline-block; width: 24px; height: 24px; border-radius: 7px; background: var(--soft); border: 1px solid var(--line2); cursor: pointer; vertical-align: middle; margin: 0 2px; transition: transform .1s; }
.cell:hover { transform: scale(1.1); }
.cell.ok { background: var(--ok); border-color: var(--ok); }
.scroll { overflow-x: auto; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 18px; }
.box pre { white-space: pre-wrap; font-family: inherit; margin: 12px 0 0; line-height: 1.75; font-size: 14px; }

/* 뜬 주제 */
.trend { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.trend:last-child { border-bottom: 0; }
.ratio { font-weight: 700; color: var(--red); font-size: 14px; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.src { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--soft); color: var(--ink2); white-space: nowrap; }
.trend a { color: var(--ink); text-decoration: none; font-weight: 500; } .trend a:hover { text-decoration: underline; }
.trend small { display: block; color: var(--ink3); font-size: 12px; }
.notes li { margin: 2px 0; }

/* 만들기 */
.make { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.make label { display: grid; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink2); }
.status { font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
.st-ready { background: #e6f4ec; color: var(--ok); } .st-requested, .st-running { background: #f8efdc; color: #9a7428; } .st-failed { background: #fbe6e5; color: var(--red); }
.weekrow { display: flex; align-items: center; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.weekrow:last-child { border-bottom: 0; }
.ok-box { border-left: 4px solid var(--ok); } .bad-box { border-left: 4px solid var(--red); }
.problems li { margin: 6px 0; }

/* 확대 보기 */
#zoom { position: fixed; inset: 0; background: rgba(12,10,8,.9); display: grid; place-items: center; z-index: 20; padding: 16px; backdrop-filter: blur(4px); }
#zoom img { max-width: 100%; max-height: 92vh; border-radius: 12px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 99px; font-size: 13.5px; z-index: 30; box-shadow: 0 12px 30px -10px rgba(0,0,0,.4); }
@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr; }
  .brand small { display: none; }
  .bar { padding: 12px 16px 8px; }
  main { padding: 20px 16px 80px; }
  h2.sec { font-size: 19px; }
}
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <div class="seal">運命<br>書齋</div>
    <h1>운명서재 스튜디오</h1>
    <p>사장님 전용 SNS 게시물 관리</p>
    <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" required>
    <button class="btn block" type="submit">들어가기</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <div class="bar">
      <div class="brand"><span class="seal">운명<br>서재</span><div><b>스튜디오</b><small>SNS 게시물 관리</small></div></div>
      <select class="field" id="weekSel" aria-label="주 고르기"></select>
      <button class="btn ghost small" id="logout">나가기</button>
    </div>
    <nav id="tabs">
      <button data-tab="today" class="on">오늘 올릴 것</button>
      <button data-tab="week">이번 주</button>
      <button data-tab="trends">뜬 주제</button>
      <button data-tab="make">만들기</button>
      <button data-tab="check">검사</button>
    </nav>
  </header>
  <main id="view"></main>
</section>

<div id="zoom" class="hidden"></div>

<script>
const CH = {
  'youtube': { name: '유튜브 쇼츠', color: 'var(--yt)', icon: '▶' },
  'instagram-reel': { name: '인스타 릴스', color: 'var(--ig)', icon: '◎', tip: '올릴 때 "Facebook에 공유"를 켜면 페이스북에도 같이 올라가요.' },
  'instagram-cards': { name: '인스타 카드뉴스', color: 'var(--ig)', icon: '▦', tip: '사진 6장을 순서대로 고르고, "Facebook에 공유"를 켜 주세요.' },
  'threads': { name: '스레드', color: 'var(--th)', icon: '@', tip: '1/2를 먼저 올리고, 2/2는 그 글에 이어서 답글로 올려 주세요.' },
};
const S = { weeks: [], week: null, data: null, tab: 'today', day: null };
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const api = async (path, opts = {}) => {
  const r = await fetch('/api/studio/' + path, { credentials: 'same-origin', headers: opts.body ? { 'Content-Type': 'application/json' } : {}, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401 && path !== 'login') { show('login'); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.code || r.status), { code: j.code, status: r.status });
  return j;
};
const fileUrl = (path, dl) => `/api/studio/file/${S.week}?path=${encodeURIComponent(path)}${dl ? '&dl=1' : ''}`;
const toast = msg => { const t = el('div', { class: 'toast' }, msg); document.body.append(t); setTimeout(() => t.remove(), 1600); };
const fmtDate = iso => { const d = new Date(iso + 'T00:00:00'); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
const todayIso = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

function show(which) {
  $('#login').classList.toggle('hidden', which !== 'login');
  $('#app').classList.toggle('hidden', which !== 'app');
  if (which === 'login') setTimeout(() => $('#pw').focus(), 50);
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  try { await api('login', { method: 'POST', body: { password: $('#pw').value } }); $('#pw').value = ''; await boot(); }
  catch (err) {
    $('#loginErr').textContent = { WRONG_PASSWORD: '비밀번호가 맞지 않아요.', TOO_MANY: '여러 번 틀려서 한 시간 동안 막혔어요.', NOT_CONFIGURED: '넷리파이에 STUDIO_PASSWORD 가 아직 없어요.' }[err.code] || '들어가지 못했어요. 잠시 뒤 다시 해 주세요.';
  }
});
$('#logout').addEventListener('click', async () => { await api('logout', { method: 'POST' }).catch(() => {}); show('login'); });
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab; render(); });
$('#weekSel').addEventListener('change', async e => { await loadWeek(e.target.value); });
$('#zoom').addEventListener('click', () => $('#zoom').classList.add('hidden'));

async function boot() {
  const me = await fetch('/api/studio/me').then(r => r.json()).catch(() => ({}));
  if (!me.loggedIn) return show('login');
  show('app');
  await loadWeeks();
}
async function loadWeeks(keep) {
  S.weeks = (await api('weeks')).weeks;
  const sel = $('#weekSel');
  sel.replaceChildren(...(S.weeks.length ? S.weeks.map(w => el('option', { value: w.week }, `${fmtDate(w.week)} 주`)) : [el('option', { value: '' }, '아직 없음')]));
  const ready = S.weeks.filter(w => w.status === 'ready');
  const cur = keep && S.weeks.find(w => w.week === keep) ? keep
    : (ready.find(w => w.week <= todayIso()) || ready[ready.length - 1] || S.weeks[0] || {}).week;
  if (cur) { sel.value = cur; await loadWeek(cur); } else { S.week = null; S.data = null; if (S.tab === 'today') S.tab = 'make'; render(); }
}
async function loadWeek(week) {
  S.week = week;
  S.data = await api('weeks/' + week);
  const days = S.data.manifest?.days || [];
  S.day = (days.find(d => d.date === todayIso()) || days[0] || {}).date;
  render();
}

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const v = $('#view');
  v.replaceChildren(({ today: viewToday, week: viewWeek, trends: viewTrends, make: viewMake, check: viewCheck })[S.tab]());
  window.scrollTo({ top: 0 });
}
const needWeek = () => el('div', { class: 'empty' }, S.week && S.data?.week?.status !== 'ready'
  ? '이 주 게시물을 만드는 중이에요. "만들기" 탭에서 진행 상황을 볼 수 있어요.'
  : '아직 만든 게시물이 없어요. "만들기" 탭에서 첫 주를 만들어 주세요.');

function copyBtn(text) {
  return el('button', { class: 'copy', type: 'button', onclick: async e => {
    e.preventDefault(); e.stopPropagation();
    try { await navigator.clipboard.writeText(text); } catch { const t = el('textarea', {}, text); document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
    e.target.classList.add('ok'); e.target.textContent = '복사됨'; setTimeout(() => { e.target.classList.remove('ok'); e.target.textContent = '복사'; }, 1400);
  } }, '복사');
}
function textBlock(label, text, open) {
  return el('details', { class: 'tx', ...(open ? { open: '' } : {}) },
    el('summary', {}, el('span', { class: 'lab' }, label), el('span', { class: 'pre' }, text.split('\n')[0]), copyBtn(text)),
    el('pre', {}, text));
}
async function setDone(id, on) {
  const r = await api('done', { method: 'POST', body: { week: S.week, id, done: on } });
  S.data.done = r.done;
  render();
}
function postCard(it) {
  const ch = CH[it.channel];
  const done = Boolean(S.data.done[it.id]);
  const media = it.video ? el('div', { class: 'media' }, el('video', { src: fileUrl(it.video), poster: it.thumb ? fileUrl(it.thumb) : undefined, controls: '', preload: 'none', playsinline: '' }))
    : it.images ? el('div', { class: 'thumbs' }, it.images.map(p => el('img', { src: fileUrl(p), loading: 'lazy', alt: '', onclick: () => { $('#zoom').replaceChildren(el('img', { src: fileUrl(p) })); $('#zoom').classList.remove('hidden'); } })))
    : null;
  const texts = Object.entries(it.texts || {});
  const dls = [];
  if (it.video) dls.push(el('a', { class: 'btn small', href: fileUrl(it.video, 1) }, '영상 받기'));
  if (it.images) dls.push(el('button', { class: 'btn small', type: 'button', onclick: () => it.images.forEach((p, i) => setTimeout(() => { const a = el('a', { href: fileUrl(p, 1) }); document.body.append(a); a.click(); a.remove(); }, i * 400)) }, `사진 ${it.images.length}장 받기`));
  return el('article', { class: 'post' + (done ? ' done' : ''), style: `--c:${ch.color}` },
    el('div', { class: 'post-head' }, el('span', { class: 'chip' }, ch.icon, ' ', ch.name), el('span', { class: 'time' }, `${it.time} 예약`),
      it.score > 0 ? el('span', { class: 'hot', title: '이번 주 레퍼런스 계정에서 뜬 주제와 겹치는 정도' }, `뜬 주제 ${it.score}`) : null),
    el('h3', {}, it.title),
    media,
    el('div', { class: 'texts' }, texts.map(([k, t], i) => textBlock(k, t, i === 0 && it.channel === 'threads'))),
    ch.tip ? el('p', { class: 'tip' }, ch.tip) : null,
    el('div', { class: 'post-foot' }, dls,
      el('button', { class: 'toggle' + (done ? ' on' : ''), type: 'button', onclick: () => setDone(it.id, !done) }, el('i', {}, '✓'), done ? '올렸어요' : '올리면 눌러 주세요')));
}

function viewToday() {
  const m = S.data?.manifest;
  if (!m) return el('div', {}, el('h2', { class: 'sec' }, '오늘 올릴 것'), needWeek());
  const days = m.days;
  const day = days.find(d => d.date === S.day) || days[0];
  const all = day.items, doneN = all.filter(i => S.data.done[i.id]).length;
  const chips = el('div', { class: 'days' }, days.map(d => el('button', { class: 'day' + (d.date === day.date ? ' on' : ''), type: 'button', onclick: () => { S.day = d.date; render(); } },
    el('span', {}, d.weekday + (d.date === todayIso() ? ' · 오늘' : '')), el('b', {}, new Date(d.date + 'T00:00:00').getDate()),
    el('div', { class: 'dots' }, d.items.map(i => el('i', { class: S.data.done[i.id] ? 'ok' : '' }))))));
  const slots = ['오전', '저녁'].map(slot => {
    const items = all.filter(i => i.slot === slot);
    return items.length ? [el('div', { class: 'slot' }, `${slot} ${items[0].time}`), el('div', { class: 'grid' }, items.map(postCard))] : [];
  });
  return el('div', {},
    el('h2', { class: 'sec' }, `${fmtDate(day.date)} (${day.weekday}) 올릴 것`),
    chips,
    el('div', { class: 'progress' }, el('div', { class: 'track' }, el('div', { class: 'fill', style: `width:${Math.round(doneN / all.length * 100)}%` })), el('span', { class: 'muted' }, `${doneN} / ${all.length} 올림`)),
    slots.flat());
}

function viewWeek() {
  const m = S.data?.manifest;
  if (!m) return el('div', {}, el('h2', { class: 'sec' }, '이번 주'), needWeek());
  const chans = Object.keys(CH);
  const head = el('tr', {}, el('th', {}, '날짜'), chans.map(c => el('th', {}, CH[c].name)));
  const rows = m.days.map(d => el('tr', {},
    el('td', { class: 'lab' }, `${fmtDate(d.date)} ${d.weekday}`),
    chans.map(c => el('td', {}, d.items.filter(i => i.channel === c).map(i => el('span', { class: 'cell' + (S.data.done[i.id] ? ' ok' : ''), title: `${i.time} ${i.title}`, onclick: () => { S.day = d.date; S.tab = 'today'; render(); } }, ''))))));
  const total = m.days.reduce((n, d) => n + d.items.length, 0), doneN = Object.keys(S.data.done).length;
  return el('div', {},
    el('h2', { class: 'sec' }, `${fmtDate(m.week)}부터 한 주`),
    el('div', { class: 'progress' }, el('div', { class: 'track' }, el('div', { class: 'fill', style: `width:${Math.round(doneN / total * 100)}%` })), el('span', { class: 'muted' }, `${doneN} / ${total} 올림`)),
    el('div', { class: 'scroll' }, el('table', { class: 'table' }, el('thead', {}, head), el('tbody', {}, rows))),
    el('p', { class: 'muted' }, '칸을 누르면 그날 화면으로 가요. 초록 칸은 올린 것이에요. 페이스북은 인스타를 올릴 때 같이 올라가요.'),
    el('h2', { class: 'sec', style: 'margin-top:28px' }, '당근 소식 (주 1회)'),
    el('div', { class: 'box', style: '--c:var(--dg); border-left:5px solid var(--dg)' },
      el('div', { style: 'display:flex;align-items:center;gap:8px' }, el('b', {}, '당근 비즈프로필 소식 글'), el('span', { style: 'margin-left:auto' }, copyBtn(m.daangn['소식']))),
      el('pre', {}, m.daangn['소식'])));
}

function viewTrends() {
  const m = S.data?.manifest;
  if (!m) return el('div', {}, el('h2', { class: 'sec' }, '뜬 주제'), needWeek());
  const t = m.trends || { items: [], notes: [] };
  const picked = m.days.flatMap(d => d.items.filter(i => i.channel === 'youtube').map(i => ({ d, i })));
  return el('div', {},
    el('h2', { class: 'sec' }, '이번 주 고른 재료'),
    el('div', { class: 'box' }, picked.map(({ d, i }) => el('div', { class: 'trend' },
      el('span', { class: 'src' }, `${d.weekday} ${i.slot}`), el('div', {}, i.title), el('span', { class: 'ratio' }, i.score > 0 ? `뜬 주제 ${i.score}` : '-')))),
    el('h2', { class: 'sec' }, '레퍼런스 계정에서 뜬 게시물'),
    el('p', { class: 'muted' }, `모은 때: ${t.fetchedAt ? t.fetchedAt.replace('T', ' ').slice(0, 16) : '-'} · 숫자는 "평소의 몇 배"예요.`),
    el('div', { class: 'box' }, t.items.length ? t.items.slice(0, 40).map(x => el('div', { class: 'trend' },
      el('span', { class: 'src' }, x.source),
      el('div', {}, x.url ? el('a', { href: x.url, target: '_blank', rel: 'noopener' }, x.title) : x.title, el('small', {}, [x.account, `${x.unit} ${Number(x.value).toLocaleString()}`, x.at].filter(Boolean).join(' · '))),
      el('span', { class: 'ratio' }, x.ratio ? `${x.ratio}배` : ''))) : el('div', { class: 'muted' }, '아직 모은 자료가 없어요. 아래 안내의 키를 넣으면 자동으로 모아요.')),
    el('div', { class: 'box' }, el('b', {}, '모으기 기록'), el('ul', { class: 'notes muted' }, (t.notes || []).map(n => el('li', {}, n)))));
}

function nextMonday() { const d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function viewMake() {
  const input = el('input', { class: 'field', type: 'date', value: nextMonday(), style: 'width:auto' });

    go.disabled = true; msg.textContent = '시작하는 중…';

    catch (e) { msg.textContent = { ALREADY_RUNNING: '그 주는 지금 만드는 중이에요.', BAD_WEEK: '날짜를 골라 주세요.' }[e.code] || '시작하지 못했어요. 잠시 뒤 다시 눌러 주세요.'; }

    el('div', { class: 'box' },
      el('div', { class: 'make' }, el('label', {}, '첫날', input), go,
        el('button', { class: 'btn ghost', type: 'button', onclick: () => loadWeeks(S.week).then(() => { S.tab = 'make'; render(); }) }, '새로고침')),
      msg,
      el('p', { class: 'muted' }, '레퍼런스 계정에서 이번 주 뜬 주제를 먼저 모으고, 겹치는 재료부터 하루 6개(유튜브 2, 인스타 릴스 1, 인스타 카드 1, 스레드 2)씩 만들어요. API 비용은 들지 않아요.')),
    el('h2', { class: 'sec' }, '만든 주'),
    el('div', { class: 'box' }, S.weeks.length ? S.weeks.map(w => el('div', { class: 'weekrow' },
      el('b', {}, `${fmtDate(w.week)} 주`), el('span', { class: 'status st-' + w.status }, label[w.status] || w.status),
      w.posts ? el('span', { class: 'muted' }, `게시물 ${w.posts}개`) : null,
      w.problems ? el('span', { class: 'muted', style: 'color:var(--red)' }, `검사 ${w.problems}건`) : null,
      w.note ? el('span', { class: 'muted' }, w.note) : null,
      w.status === 'ready' ? el('button', { class: 'btn ghost small', style: 'margin-left:auto', type: 'button', onclick: () => { $('#weekSel').value = w.week; loadWeek(w.week).then(() => { S.tab = 'today'; render(); }); } }, '보기') : null))
      : el('div', { class: 'muted' }, '아직 만든 주가 없어요.')));
}

function viewCheck() {

        : [el('b', {}, '문제 없음'), el('p', { class: 'muted' }, '금지어, 과장 약속, 채널별 글자 수, 사이트 주소, 사주 근거(엔진 계산과 같은지)를 모두 확인했어요.')]),
    el('div', { class: 'box' }, el('b', {}, '검사하는 것'), el('ul', { class: 'muted' },
