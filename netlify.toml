# 넷리파이 설정: site 폴더의 public 을 사이트로, netlify/functions 를 주문 서버로 올린다.
[build]
  base = "site"
  publish = "public"
  functions = "netlify/functions"
  command = "npm test"   # 제1조항: 무료 분석·결제 전 화면이 리포트(파이썬)와 같은 답인지 검사하고, 틀리면 올리지 않는다

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 관리 사이트(사장님 전용): 검색에 안 뜨게, 저장해 두지 않게
[[headers]]
  for = "/studio/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

# 상품이 정해진 짧은 주소는 /p/상품/ 공유 페이지를 거친다(2026-11-05: 카톡·인스타 미리보기에 그 상품 카드가 뜨게). 공유 페이지가 ?from= 을 그대로 넘긴다.
# 손님이 어디서 왔는지 남기는 짧은 주소(사장님 2026-11-03 "링크 못생겨져").
# 사이트가 ?from= 을 30일 기억했다가 주문에 같이 저장하고, 주소창에서는 바로 지운다. ?go= 는 그 상품 첫 화면.
# 당근 소식 링크: 소식이 말하는 상품(2027 신년운세) 첫 화면으로 바로(2026-11-05 자청 점검 F-1, 예전에는 홈)
[[redirects]]
  from = "/d"
  to = "/p/newyear/?from=d"
  status = 302
[[redirects]]
  from = "/dn"
  to = "/p/newyear/?from=dn"
  status = 302
