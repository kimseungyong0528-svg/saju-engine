name: livecap
on: push
jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cd .github/livecap && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          mkdir -p shots && OUT=shots node cap.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: .github/livecap/shots }
