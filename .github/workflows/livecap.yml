name: livecap
on: push
permissions:
  contents: write
jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cd .github/livecap && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          mkdir -p shots && OUT=shots node cap.js
      - if: always()
        run: |
          git config user.name livecap && git config user.email livecap@users.noreply.github.com
          git add -f .github/livecap/shots && git commit -m "임시: 결제 화면 사진" && git push
