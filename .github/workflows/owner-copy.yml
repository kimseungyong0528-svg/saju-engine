# 이미 손님에게 보낸 리포트 PDF를 사장님 메일(OWNER_EMAIL)로 한 번 더 보낸다.
# Actions → 사장님께 리포트 사본 → Run workflow 에 주문번호를 넣는다. PDF는 서버에 7일 동안 있다.
name: 사장님께 리포트 사본

on:
  workflow_dispatch:
    inputs:
      order_id:
        description: 주문번호
        required: true

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 사본 보내기
        env:
          ORDER_ID: ${{ inputs.order_id }}
          SITE_URL: ${{ vars.SITE_URL || 'https://unmyeong-saju.com' }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          if ! [[ "$ORDER_ID" =~ ^[a-f0-9-]{36}$ ]]; then echo "주문번호 형식이 아님"; exit 1; fi
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST -H "X-Worker-Secret: $WORKER_SECRET" -H "User-Agent: unmyeong-worker" "$SITE_URL/api/internal/orders/$ORDER_ID/owner-copy")
          echo "HTTP $code $(cat out.json)"
          [ "$code" = 200 ]
