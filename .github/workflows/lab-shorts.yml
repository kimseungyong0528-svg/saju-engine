# 임시: 새 쇼츠(목소리·순위형) 하루치를 만들어 걸린 시간과 결과를 남긴다. 관리 사이트에는 올리지 않는다. 끝나면 지운다
name: 시험 - 쇼츠 하루치
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-7uafe7]
    paths: [saju/marketing/**, .github/workflows/lab-shorts.yml]
permissions:
  contents: write
jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SAJU_VOICE: F2
      SAJU_ART: free
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: shorts-tools-v1
      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-noto-cjk poppler-utils ffmpeg > /dev/null
          pip install -q -e ".[report,video]"
          python -m playwright install --with-deps chromium
          nproc
      - name: 하루치 만들기
        run: |
          start=$(date +%s)
          python -m saju.marketing --start 2026-10-19 --days 1 --out lab/shorts-out
          echo "걸린 초: $(( $(date +%s) - start ))" | tee lab/shorts-out/time.txt
          nproc >> lab/shorts-out/time.txt
      - name: 결과 올리기
        run: |
          git config user.name "lab-bot" && git config user.email "lab-bot@users.noreply.github.com"
          git add lab/shorts-out && git commit -m "시험 결과: 쇼츠 하루치 [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin ${{ github.ref_name }} && git push && break; sleep 5; done
