# 사장님이 영상 견본을 보고 "올려" 한 날: 그날 영상 2개 + 인스타 캡처 게시글·페북 글을 관리 사이트에 넣고 승인한다.
# 영상은 다시 만들지 않고 video-samples 브랜치(사장님이 본 파일)를 그대로 쓴다. 손으로만 돌린다 (사장님 "올려" 뒤에만).
name: 오늘 영상·게시글 넣기
on:
  workflow_dispatch:
    inputs:
      date:
        description: 날짜 (예 2026-11-02)
        required: true
      picks:
        description: 인스타 캡처·페북 글로 올릴 스레드 글 표시 (12:30, 21:00 순서, 예 1탄,2탄)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://unmyeong-saju.com' }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q -e ".[report,video]"
          python -m playwright install --with-deps chromium
      - name: 사장님이 본 영상 가져오기
        run: |
          git fetch -q origin video-samples
          git archive FETCH_HEAD video-samples | tar -x
      - run: python -m saju.marketing.formula.today_videos --date "${{ inputs.date }}" --src video-samples --picks "${{ inputs.picks }}"
