# 승인한 게시물을 인스타·페이스북·스레드에 올린다 (메타 공식 API, 무료).
# 출근길·퇴근길에 맞춰 한국 시각 아침 7시 30분, 저녁 6시쯤 올라간다.
# GitHub 예약 실행은 몇 분 늦게 시작하므로 13분 일찍 걸어 둔다.
# 손으로 돌릴 때: Actions → SNS 자동 게시 → Run workflow (dry 를 켜면 올리지 않고 목록만 본다).
name: SNS 자동 게시

on:
  schedule:
    - cron: "17 22 * * *"   # 한국 07:17 → 오전
    - cron: "47 8 * * *"    # 한국 17:47 → 저녁
  workflow_dispatch:
    inputs:
      slot:
        description: 오전 또는 저녁
        required: true
        default: 오전
      date:
        description: 날짜 (비우면 오늘)
        required: false
      dry:
        description: 올리지 않고 목록만 보기 (true/false)
        required: false
        default: "false"

concurrency:
  group: sns-post
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://unmyeong-saju.com' }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      SNS_SITE_LINK: ${{ vars.SNS_SITE_LINK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -e ".[report]"
      - name: 올리기
        run: |
          SLOT="${{ inputs.slot }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "17 22 * * *" ]; then SLOT=오전; else SLOT=저녁; fi
          fi
          ARGS=(--slot "$SLOT")
          [ -n "${{ inputs.date }}" ] && ARGS+=(--date "${{ inputs.date }}")
          [ "${{ inputs.dry }}" = "true" ] && ARGS+=(--dry)
          python -m saju.marketing.meta "${ARGS[@]}"
