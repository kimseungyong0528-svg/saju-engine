# 일주일치 SNS 게시물(쇼츠 영상, 릴스, 카드뉴스, 채널별 글)을 만들어 관리 사이트(/studio)에 올린다. API는 쓰지 않는다.
# 관리 사이트의 '만들기' 버튼이 이 작업을 시작시킨다. 손으로 돌릴 때는
# Actions → SNS 게시물 만들기 → Run workflow 에 첫날(월요일)을 넣는다.
# 게시물은 사이트 저장소에만 올라가므로 사이트 배포(넷리파이 크레딧)는 쓰지 않는다.
name: SNS 게시물 만들기

# 매일 오후 2시(한국)에 다음 날 하루치를 저절로 만든다. 사장님이 저녁에 /studio 에서 보고 승인한다.
on:
  schedule:
    - cron: "7 5 * * *"
  repository_dispatch:
    types: [studio]
  workflow_dispatch:
    inputs:
      start:
        description: 첫날 (예 2026-10-19)
        required: true
      days:
        description: 며칠치 (1 또는 7)
        required: false
        default: "7"

concurrency:
  group: studio-${{ github.event.client_payload.start || inputs.start || 'daily' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  posts:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      START: ${{ github.event.client_payload.start || inputs.start }}
      DAYS: ${{ github.event.client_payload.days || inputs.days || 7 }}
      SITE_URL: ${{ vars.SITE_URL || 'https://unmyeong-saju.com' }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      SAJU_VOICE: ${{ vars.SAJU_VOICE || 'F2' }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: 날짜 확인
        run: |
          if [ -z "$START" ]; then
            START=$(TZ=Asia/Seoul date -d tomorrow +%F); DAYS=1
            echo "START=$START" >> "$GITHUB_ENV"; echo "DAYS=$DAYS" >> "$GITHUB_ENV"
          fi
          if ! [[ "$DAYS" =~ ^(1|7)$ ]]; then echo "며칠치는 1 또는 7"; exit 1; fi
          if ! [[ "$START" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]]; then echo "날짜 형식이 아님 (예 2026-10-19)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: shorts-tools-v1
      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-noto-cjk poppler-utils ffmpeg > /dev/null
          pip install -q -e ".[report,video]"
          python -m playwright install --with-deps chromium
      - name: 게시물 만들고 관리 사이트에 올리기
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m saju.marketing --start "$START" --days "$DAYS" --out 게시물 --trends --publish
      - name: 실패하면 관리 사이트에 알리기
        if: failure()
        run: |
          python -c "from saju.marketing import publish; publish.status('$START', 'failed', '만들기 실패: Actions 기록 확인')" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SNS게시물-${{ env.START }}
          path: 게시물
          retention-days: 7
          if-no-files-found: ignore
