# 일주일치 SNS 게시물(카드뉴스 이미지, 쇼츠 영상, 채널별 글, 일정표)을 만든다. API는 쓰지 않는다.
# Actions → SNS 게시물 만들기 → Run workflow 에 첫날과 몇 번째 주인지 넣으면,
# 끝난 뒤 그 실행 화면 아래 Artifacts 에서 zip 으로 받을 수 있다.
name: SNS 게시물 만들기

on:
  workflow_dispatch:
    inputs:
      start:
        description: 첫날 (예 2026-10-19)
        required: true
      week:
        description: 몇 번째 주 (1 또는 2)
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  posts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-noto-cjk poppler-utils ffmpeg > /dev/null
          pip install -q -e ".[report]"
      - name: 게시물 만들기
        env:
          START: ${{ inputs.start }}
          WEEK: ${{ inputs.week }}
        run: |
          if ! [[ "$START" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]]; then echo "날짜 형식이 아님 (예 2026-10-19)"; exit 1; fi
          if ! [[ "$WEEK" =~ ^[1-9]$ ]]; then echo "주 번호는 숫자 하나"; exit 1; fi
          python -m saju.marketing --start "$START" --days 7 --offset $(( (WEEK - 1) * 7 )) --out 게시물
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SNS게시물-${{ inputs.start }}
          path: 게시물
          retention-days: 14
