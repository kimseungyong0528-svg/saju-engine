# 일주일치 SNS 게시물(쇼츠 영상, 릴스, 카드뉴스, 채널별 글)을 만들어 관리 사이트(/studio)에 올린다. API는 쓰지 않는다.
# 관리 사이트의 '만들기' 버튼이 이 작업을 시작시킨다. 손으로 돌릴 때는
# Actions → SNS 게시물 만들기 → Run workflow 에 첫날(월요일)을 넣는다.
# 게시물은 사이트 저장소에만 올라가므로 사이트 배포(넷리파이 크레딧)는 쓰지 않는다.
name: SNS 게시물 만들기

# 매일 저절로 만드는 일정은 껐다 (사장님 2026-11-01 "그건 꺼야되고"). 심사원 50명 심사(CLAUDE.md 제2조항)를
# 거치지 않은 글이 올라가기 때문이다. 심사를 마친 주만 사장님 "올려" 뒤에 손으로 돌린다.
on:
  repository_dispatch:
    types: [studio]
  workflow_dispatch:
    inputs:
      start:
        description: 첫날 (예 2026-10-19)
        required: true
      days:
        description: 며칠치 (1~14, 보통 7)
        required: false
        default: "7"
      shift:
        description: 스레드 글 한 칸씩 미루기 시작 칸 (예 "2026-11-01 늦은밤", 비우면 안 미룸)
        required: false
        default: ""
      move:
        description: 게시물 옮기기 (예 "11-01_점심-threads=2026-11-02 저녁", 비우면 안 옮김)
        required: false
        default: ""
      video:
        description: 영상도 만들기 (사장님 2026-11-01 "영상은 올리지마 확실히 될때까지 일단 스레드만" → 기본은 false, 스레드 글만)
        required: false
        default: "false"
      approve:
        description: 심사원 50명 심사를 통과한 주면 true (스레드 글을 클로드가 한 번에 승인)
        required: false
        default: "false"
      approve_videos:
        description: 사장님이 "올려" 한 주면 true (인스타·페북·유튜브 영상을 클로드가 한 번에 승인)
        required: false
        default: "false"

concurrency:
  group: studio-${{ github.event.client_payload.start || inputs.start || 'daily' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  posts:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      START: ${{ github.event.client_payload.start || inputs.start }}
      DAYS: ${{ github.event.client_payload.days || inputs.days || 7 }}
      SHIFT: ${{ inputs.shift || '' }}
      MOVE: ${{ inputs.move || '' }}
      VIDEO: ${{ inputs.video || 'false' }}
      APPROVE: ${{ inputs.approve || 'false' }}
      APPROVE_VIDEOS: ${{ inputs.approve_videos || 'false' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://unmyeong-saju.com' }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      SAJU_VOICE: ${{ vars.SAJU_VOICE || 'F2' }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: 날짜 확인
        run: |
          if [ -z "$START" ]; then
            START=$(TZ=Asia/Seoul date -d tomorrow +%F); DAYS=1
            echo "START=$START" >> "$GITHUB_ENV"; echo "DAYS=$DAYS" >> "$GITHUB_ENV"
          fi
          if ! [[ "$DAYS" =~ ^([1-9]|1[0-4])$ ]]; then echo "며칠치는 1~14"; exit 1; fi
          if ! [[ "$START" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]]; then echo "날짜 형식이 아님 (예 2026-10-19)"; exit 1; fi
          # 매일 자동으로 돌 때: 그 날이 이미 만든 묶음(심사한 1주일치 등)에 들어 있으면 새로 만들지 않는다. 덮어쓰면 심사한 글이 바뀐다.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            N=$(curl -fsS -H "X-Worker-Secret: $WORKER_SECRET" "$SITE_URL/api/internal/studio/today?date=$START" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("items") or []))' || echo 0)
            if [ "$N" != "0" ]; then echo "$START 은 이미 만든 묶음에 있어서 건너뜀"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        if: env.SKIP != '1'
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
            ~/.cache/saju-media
          key: shorts-tools-v2
      - name: 도구 설치
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-noto-cjk poppler-utils ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q -e ".[report,video]"
          python -m playwright install --with-deps chromium
      - name: 게시물 만들고 관리 사이트에 올리기
        if: env.SKIP != '1'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        # 공식(사장님 2026-11-01): 아침 영상 5형식 + 저녁 스레드 이어 쓰기. 배경 영상은 처음 한 번 받아서 캐시에 둔다.
        run: python -m saju.marketing.formula --start "$START" --days "$DAYS" --out 게시물 --publish --shift-threads "$SHIFT" --move "$MOVE" $([ "$VIDEO" = "true" ] || echo --no-video) $([ "$APPROVE" = "true" ] && echo --approve-threads) $([ "$APPROVE_VIDEOS" = "true" ] && echo --approve-videos)
      - name: 실패하면 관리 사이트에 알리기
        if: failure()
        run: |
          python -c "from saju.marketing import publish; publish.status('$START', 'failed', '만들기 실패: Actions 기록 확인')" || true
      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != '1'
        with:
          name: SNS게시물-${{ env.START }}
          path: 게시물
          retention-days: 7
          if-no-files-found: ignore
