# 시험용(지울 것): Mixkit 무료 영상(상업·SNS 사용 가능)에서 예쁜 자연·야경·카페 영상을 받아 refs-mixkit 가지에 올린다.
name: lab-photos
on:
  push:
    branches: [claude/project-thread-7uafe7]
    paths: [.github/workflows/lab-photos.yml]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
      - run: |
          mkdir out && cd out
          cat > g.py <<'PY'
          import json, re, subprocess, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          get = lambda u: urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120).read()
          tags = ["sunset", "sea", "beach", "flowers", "cherry-blossom", "forest", "lake", "waterfall", "snow", "clouds", "sky", "nature",
                  "night", "city-lights", "city", "lights", "bokeh", "rain", "coffee", "cafe", "restaurant", "aesthetic", "vertical", "landscape"]
          meta, seen = [], set()
          for t in tags:
              try: h = get(f"https://mixkit.co/free-stock-video/{t}/").decode("utf-8", "ignore")
              except Exception as e: print("page", t, e); continue
              links = re.findall(r"https://assets\.mixkit\.co/[^\"'\s<>]+?\.mp4", h)
              ids = []
              for l in links:
                  m = re.search(r"/videos/(\d+)/", l) or re.search(r"(mixkit-[a-z0-9-]+?)-(?:large|small|medium)", l)
                  k = m.group(1) if m else l
                  if k not in seen and k not in [i for i, _ in ids]: ids.append((k, l))
              print(t, len(links), len(ids))
              n = 0
              for k, l in ids:
                  if n >= 8: break
                  cand = [l]
                  m = re.search(r"/videos/(\d+)/", l)
                  if m: cand = [f"https://assets.mixkit.co/videos/{k}/{k}-1080.mp4", f"https://assets.mixkit.co/videos/{k}/{k}-720.mp4", l]
                  f = f"{t}-{n}"
                  for c in cand:
                      try:
                          open(f + ".src", "wb").write(get(c))
                          subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", f + ".src", "-t", "12", "-an", "-vf", "scale=-2:1080",
                                          "-c:v", "libx264", "-crf", "22", "-preset", "veryfast", f + ".mp4"], check=True)
                          subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-ss", "3", "-i", f + ".mp4", "-frames:v", "1", "-vf", "scale=-2:270", f + ".jpg"])
                          wh = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "stream=width,height", "-of", "csv=p=0", f + ".src"], capture_output=True, text=True).stdout.strip()
                          subprocess.run(["rm", "-f", f + ".src"])
                          meta.append({"file": f + ".mp4", "id": k, "src": c, "wh": wh, "tag": t}); seen.add(k); n += 1
                          break
                      except Exception as e: print("fail", c, e)
          open("videos.json", "w").write(json.dumps(meta, ensure_ascii=False, indent=1))
          PY
          python3 g.py; rm g.py; ls | head -300; du -sh .
      - run: |
          cd out && git init -q && git checkout -q -b refs-mixkit && git add . && git -c user.name=bot -c user.email=bot@x commit -qm videos
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" refs-mixkit
