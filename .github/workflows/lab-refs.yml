name: 시험 - 레퍼런스 인기 게시물 모으기
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/lab-refs.yml", "lab/refs.py"]
    branches: [claude/project-thread-7uafe7]
permissions:
  contents: write
jobs:
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp
      - run: python lab/refs.py
      - name: 결과를 refs-data 가지에 올리기
        run: |
          cd refs && git init -q -b refs-data && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm "refs $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" refs-data
