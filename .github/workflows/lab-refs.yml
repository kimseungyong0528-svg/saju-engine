name: 시험 - 레퍼런스 인기 게시물 모으기
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/lab-refs.yml", "lab/refs.py"]
    branches: [claude/project-thread-7uafe7]
permissions:
  contents: read
jobs:
  refs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp
      - run: python lab/refs.py
      - uses: actions/upload-artifact@v4
        with:
          name: refs
          path: refs
