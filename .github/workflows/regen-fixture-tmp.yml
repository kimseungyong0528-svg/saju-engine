name: regen-fixture-tmp
on:
  push:
    branches: [aside/batch-2026-11-06]
    paths: ['.github/workflows/regen-fixture-tmp.yml']
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aside/batch-2026-11-06
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e ".[dev]"
      - run: python site/tools/make_taster_fixture.py
      - run: |
          git config user.name "aside-bot"
          git config user.email "aside-bot@users.noreply.github.com"
          git rm -q .github/workflows/regen-fixture-tmp.yml
          git add site/tests/fixtures/taster-parity.json
          git commit -m "정답표 다시 만들기(texts.json 문장 변경)"
          git push
