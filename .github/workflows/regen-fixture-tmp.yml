# 임시 작업(aside/fix-abcd-2026-11-06 전용, 합치기 전에 지운다): 돈의 별 4개 규칙(reveal.py) 반영 정답표 다시 만들기 + 관련 파이썬 검사
name: 정답표 다시 만들기 (임시)
on:
  push:
    branches: [aside/fix-abcd-2026-11-06]
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aside/fix-abcd-2026-11-06
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-noto-cjk poppler-utils > /dev/null
          pip install -q -e ".[dev]"
      - name: 정답표 만들기
        run: python site/tools/make_taster_fixture.py
      - name: 바뀌었으면 올리기
        run: |
          if git diff --quiet -- site/tests/fixtures/taster-parity.json; then echo "no change"; else
          git config user.name "aside-bot"
          git config user.email "aside-bot@users.noreply.github.com"
          git add site/tests/fixtures/taster-parity.json
          git commit -m "정답표 다시 만들기 (돈의 별 4개 규칙)"
          git push; fi
      - name: 관련 파이썬 검사
        run: python -m pytest -q tests/test_reveal.py tests/test_unity.py tests/test_theme_products.py tests/test_taster_consistency.py
