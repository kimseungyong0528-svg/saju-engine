name: livecheck
on: push
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 40); do
            h=$(curl -s "https://unmyeong-saju.com/?v=$RANDOM")
            if echo "$h" | grep -q "function salesPage(p,i){return checkoutPage(p,i)}" && echo "$h" | grep -q "여기를 눌러서 할인 받기" && echo "$h" | grep -q "rv-faq"; then echo "LIVE OK"; exit 0; fi
            sleep 15
          done
          echo "NOT LIVE"; exit 1
