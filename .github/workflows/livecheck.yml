name: livecheck
on: push
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 40); do
            c=$(curl -s "https://unmyeong-saju.com/?v=$RANDOM")
            if echo "$c" | grep -q "목차 2번부터" && echo "$c" | grep -q "rv-price"; then echo "LIVE OK"; exit 0; fi
            sleep 15
          done
          echo "NOT LIVE"; exit 1
