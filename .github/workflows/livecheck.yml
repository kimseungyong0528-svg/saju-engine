name: livecheck
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 120
          for i in 1 2 3 4 5 6; do
            n=$(curl -s https://unmyeong-saju.com/ | grep -c "tp-frame")
            echo "try $i tp-frame=$n"; [ "$n" -gt 0 ] && break; sleep 60
          done
          curl -s https://unmyeong-saju.com/ | grep -c "data-toc-toggle" || true
