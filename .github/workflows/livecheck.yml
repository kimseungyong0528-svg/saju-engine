name: livecheck
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 120
          for i in 1 2 3 4 5 6; do
            n=$(curl -s https://unmyeong-saju.com/ | grep -c "qb-final")
            echo "try $i qb-final=$n"; [ "$n" -gt 0 ] && break; sleep 60
          done
          curl -s https://unmyeong-saju.com/ | grep -o "돈이 새기 쉬운 시기" | head -1
