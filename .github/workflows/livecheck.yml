name: livecheck
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 120
          for i in 1 2 3 4 5 6; do
            n=$(curl -s https://unmyeong-saju.com/ | grep -c "SALES.wealth")
            echo "try $i SALES.wealth=$n"; [ "$n" -gt 0 ] && break; sleep 60
          done
          curl -s https://unmyeong-saju.com/ | grep -c "newyear-poster.webp\" alt" || true
          curl -s -o /dev/null -w "pv8 %{http_code}\n" https://unmyeong-saju.com/assets/preview/wealth-8.webp
