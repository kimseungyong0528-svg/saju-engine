name: livecheck
on: push
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 40); do
            h=$(curl -s "https://unmyeong-saju.com/?v=$RANDOM")
            if echo "$h" | grep -q "rv-more" && echo "$h" | grep -q "이메일 확인 뒤 적용"; then echo "LIVE OK"; exit 0; fi
            sleep 15
          done
          echo "NOT LIVE"; exit 1
